<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Law 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#f8f9fa; --sur:#ffffff; --bdr:#e5e7eb; --bdr2:#d1d5db;
  --txt:#111827; --txt2:#374151; --txt3:#6b7280; --txt4:#9ca3af;
  --pri:#3ecf8e; --pri-dk:#2baa74;
  --font:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--txt2)}
.topbar{display:flex;align-items:center;gap:12px;background:#0b0f19;padding:12px 24px}
.topbar-back{color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none}
.topbar-back:hover{opacity:.8}
.topbar-title{color:#94a3b8;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid #374151;padding-left:12px}
.wrap{max-width:760px;margin:0 auto;padding:36px 24px 100px}
.doc-card{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:32px 36px}
.meta{font-size:11.5px;color:var(--txt4);margin-bottom:22px;word-break:break-all}
.doc{font-size:15.5px;line-height:1.95;color:var(--txt2)}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5{color:var(--txt);font-weight:700;line-height:1.5}
.doc h3{font-size:17px;margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--txt);display:inline-block}
.doc h4{font-size:15.5px;margin:24px 0 8px;color:var(--pri-dk)}
.doc h5{font-size:14.5px;margin:18px 0 6px;color:var(--txt3)}
.doc p{margin:0 0 10px}
.doc strong{color:var(--txt);font-weight:700}
.doc hr{border:none;border-top:1px solid var(--bdr);margin:22px 0}
.doc code{background:#f1f5f9;padding:1px 6px;border-radius:5px;font-size:13px;color:#0e7490}
.state{color:var(--txt4);font-size:14px;padding:60px 0;text-align:center}
</style>
</head>
<body>
<header class="topbar">
  <a class="topbar-back" href="javascript:history.back()">← 뒤로</a>
  <span class="topbar-title" id="doc-title">불러오는 중...</span>
</header>
<div class="wrap">
  <div class="doc-card">
    <div class="meta" id="doc-meta"></div>
    <div class="doc" id="doc-body"><div class="state">불러오는 중...</div></div>
  </div>
</div>
<script>
// K-Law 문서 뷰어. 판결문·개요·가상판결문은 진짜 마크다운이 아니라 "줄바꿈마다 완결된 문장"인
// 서식이라, 마크다운 파서(문단 병합, 번호 목록 해석)에 그대로 넣으면 "1. 사안의 개요"류 줄이
// 다음 줄과 억지로 합쳐지는 문제가 있었다. 그래서 외부 라이브러리 없이 줄 단위로 직접 렌더링한다:
// 【라벨】만 있는 줄 -> 소제목, #/##/### 로 시작하는 줄(klaw_verdict.txt가 이미 이 표기를 씀) -> 제목,
// ---/─── 로만 된 줄 -> 구분선, **강조**와 `코드` -> 인라인 서식, 그 외 모든 줄은 각각 독립된 문단.
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function inlineFormat(s) {
  s = escapeHtml(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}
function renderDoc(text) {
  var lines = text.replace(/\r\n/g, '\n').split('\n');
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/^\s*$/.test(line)) continue;
    var bracketOnly = line.match(/^【([^】]+)】\s*$/);
    if (bracketOnly) { html += '<h3>【' + escapeHtml(bracketOnly[1]) + '】</h3>\n'; continue; }
    var mdHeader = line.match(/^(#{1,4})\s+(.*)$/);
    if (mdHeader) { var lvl = mdHeader[1].length + 1; html += '<h' + lvl + '>' + inlineFormat(mdHeader[2]) + '</h' + lvl + '>\n'; continue; }
    if (/^[-─━]{3,}\s*$/.test(line.trim())) { html += '<hr>\n'; continue; }
    html += '<p>' + inlineFormat(line) + '</p>\n';
  }
  return html || '<div class="state">내용이 비어 있습니다.</div>';
}

var qs = new URLSearchParams(location.search);
var src = qs.get('src');
var title = qs.get('title') || (src ? src.split('/').pop() : 'K-Law 문서');
document.title = title + ' - K-Law';
document.getElementById('doc-title').textContent = title;
var bodyEl = document.getElementById('doc-body');
if (!src) {
  bodyEl.innerHTML = '<div class="state">src 파라미터가 없습니다.</div>';
} else {
  document.getElementById('doc-meta').textContent = src;
  fetch(src).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (text) {
    bodyEl.innerHTML = renderDoc(text);
  }).catch(function (e) {
    bodyEl.innerHTML = '<div class="state">불러오지 못했습니다: ' + e.message + '</div>';
  });
}
</script>
</body>
</html>
