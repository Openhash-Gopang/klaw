<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>K-Law — AI 판결 상담</title>
<meta name="description" content="K-Law 전문 AI와 대화를 통해 사건 개요를 파악하고 가상 판결문을 작성합니다.">
<!-- 2026-07-31 신설 — 브라우저 기본 /favicon.ico 자동요청이 404로 콘솔에 매번
     찍히던 문제 해결. 별도 아이콘 파일/네트워크 요청 없이 SVG data URI로
     완결(K-Law 상단 바 색 --gov:#001845 재사용). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23001845%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22%27Pretendard%27%2C%27Malgun%20Gothic%27%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3E%E6%B3%95%3C/text%3E%3C/svg%3E">

<!-- K-서비스 공용 전화번호 인증 모듈 (2026-09-06 — 이 페이지 자체 구현을
     대체) — 로그인하면 plan.hondi.net·mail.hondi.net 등 다른 K-서비스에도
     .hondi.net 쿠키로 자동 로그인된다. 기존 고팡 지갑 SSO
     (subsystem-auth.js)는 크로스 도메인 릴레이 버그가 있어 더 이상
     로드하지 않는다(주피터 지시, 2026-09-06). 참고: 이 변경으로
     klawUser/_klawGuid()/window._onGopangAuth(닉네임 표시·PDV 로깅에
     쓰이던 지갑 guid)는 더 이상 채워지지 않고 GWP_TOKEN(URL 쿼리)·
     'anonymous' 폴백만 남는다 — 실제 상담 인증(_klawCall의
     phone_verify_token)에는 원래부터 영향 없었다(서버가 phone_verify_token
     에서 직접 guid를 도출하고 클라이언트 guid는 버림, 아래 주석 참고). -->
<script>
window.K_AUTH_CONFIG = { serviceLabel: 'K-Law' };
</script>
<script src="https://hondi.net/auth/k-service-auth-client.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --gov:     #001845;
  --nav:     #002D72;
  --pri:     #0057A8;
  --pri-lt:  #006CC3;
  --pri-bg:  #EBF3FC;
  --pri-bd:  #B8D4F0;
  --sur:     #FFFFFF;
  --bg:      #F2F5FA;
  --bdr:     #D1D9E6;
  --txt:     #1A202C;
  --sub:     #4A5568;
  --hint:    #718096;
  --grn:     #1B6B3A; --gbg:#E6F4EC; --gbd:#A3D9B8;
  --red:     #C01C28; --rbg:#FEE2E2;
  --org:     #C05621; --obg:#FEF3E2;
  --pur:     #5B2D8E; --pbg:#F0EAF8;
  --gld:     #96760A; --ybg:#FEF3CD;
  --font:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
  --r:10px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
/* BUG-FIX(2026-07-03): html/body의 height:100%는 일부 모바일 브라우저/웹뷰에서
   실제 뷰포트와 어긋나(동적 툴바, 100vh 계산 오차 등) body 상하좌우에
   원인 불명의 여백이 생기는 사례가 있다. position:fixed;inset:0으로
   body 자체를 뷰포트에 강제로 고정하면 이 문제 자체가 성립하지 않는다
   — html의 높이 계산과 완전히 무관해진다. */
body{
  position:fixed;inset:0;margin:0;padding:0;
  font-family:var(--font);font-size:15px;color:var(--txt);background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;
}
a{text-decoration:none;color:inherit}
button{font-family:var(--font)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border:2px solid rgba(0,87,168,.2);border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}

/* BUG-FIX(2026-07-03): 정적 코드 검토로는 원인을 특정 못 했지만("입력창
   아래에 판결문 제목이 그대로 노출됨" — window.open()이 진짜 새 탭 대신
   같은 문서에 콘텐츠를 이어붙이는 것으로 동작하는 브라우저/웹뷰 환경이
   있는 것으로 추정), 원인이 무엇이든 "body의 직계 자식은 아래 5개뿐이어야
   한다"를 CSS로 강제하면 결과적으로 봉쇄된다. 화이트리스트에 없는 요소가
   어떤 경로로든 body에 직접 붙으면 무조건 숨긴다.
   ID/class 선택자가 element 선택자(body>*)보다 명시도가 높으므로, 아래
   5개는 각자 정의된 display 값으로 정상 노출되고 나머지만 숨겨진다. */
body > *{display:none}
.sheet-backdrop{display:block}
.sheet{display:block}

/* ── 상단바 — 항상 최상단, 좌우 여백 없음 ── */
#top-bar{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  width:100%;margin:0;
  padding:10px 12px 10px;padding-top:calc(10px + env(safe-area-inset-top));
  padding-left:calc(12px + env(safe-area-inset-left));
  padding-right:calc(12px + env(safe-area-inset-right));
  background:var(--gov);color:#fff;box-shadow:var(--sh);z-index:20;
}
.tb-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.tb-icon{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:14px}
.tb-sub{font-size:11px;font-weight:400;opacity:.75;margin-left:2px}
.tb-gear{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tb-gear:active{background:rgba(255,255,255,.22)}

/* ── 대화 스레드 ── */
#chat-thread{
  flex:1;overflow-y:auto;padding:18px 14px 10px;display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.bubble{max-width:88%;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.65;white-space:normal;word-break:break-word;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.bubble-ai{align-self:flex-start;background:var(--sur);border:1px solid var(--bdr);border-top-left-radius:4px;color:var(--txt);box-shadow:var(--sh)}
.bubble-user{align-self:flex-end;background:var(--pri);color:#fff;border-top-right-radius:4px}
.bubble-typing{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--sur);border:1px solid var(--bdr);border-radius:14px;border-top-left-radius:4px;font-size:12.5px;color:var(--hint)}

/* ── 분석 카드 / 판결 요약 카드 ── */
.analysis-card{display:flex;flex-direction:column;gap:8px}
.ac-type{display:inline-block;align-self:flex-start;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px}
.ac-row b{display:block;font-size:11.5px;color:var(--hint);font-weight:700;margin-bottom:2px}
.verdict-card{display:flex;flex-direction:column;gap:10px}
.vc-badge{font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-bg);border:1px solid var(--pri-bd);border-radius:6px;padding:4px 8px;align-self:flex-start}
.vc-summary{font-size:14px;font-weight:600;line-height:1.7}
.vc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px}
.vc-grid > div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.vc-grid span{color:var(--hint);font-size:11px}
.vc-grid b{color:var(--pri);font-size:15px}
.vc-caution{font-size:11.5px;color:var(--hint);line-height:1.6;border-top:1px dashed var(--bdr);padding-top:8px}

/* ── 진행률 ── */
.progress-wrap{display:flex;flex-direction:column;gap:6px;min-width:220px}
.progress-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--pri);transition:width .3s}
.progress-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hint)}

/* ── 입력바 ── */
#input-bar{
  flex-shrink:0;display:flex;align-items:flex-end;gap:8px;
  padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  padding-left:calc(10px + env(safe-area-inset-left));
  padding-right:calc(10px + env(safe-area-inset-right));
  background:var(--sur);border-top:1px solid var(--bdr);
}
.mic-btn{
  width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--bdr);background:var(--bg);
  color:var(--pri);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.attach-btn{
  width:36px;height:36px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--bdr);background:var(--bg);
  color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.attach-btn:active{background:var(--pri-bg);color:var(--pri);border-color:var(--pri-bd)}
.attach-btn svg{width:16px;height:16px}
.file-chips{flex-shrink:0;display:flex;gap:6px;flex-wrap:wrap;padding:0 12px;margin-bottom:-2px}
.file-chips:empty{display:none;margin:0}
.file-chip{display:flex;align-items:center;gap:5px;background:var(--pri-bg);border:1px solid var(--pri-bd);border-radius:999px;padding:4px 10px 4px 12px;font-size:11.5px;color:var(--pri)}
.file-chip button{border:none;background:none;color:var(--pri);cursor:pointer;font-size:12px;line-height:1;padding:0}
.mic-btn.recording{background:var(--rbg);border-color:#fca5a5;color:var(--red);animation:pulse 1s infinite}
.mic-btn svg{width:18px;height:18px}
#chat-input{
  flex:1;resize:none;max-height:120px;min-height:40px;padding:10px 14px;border-radius:20px;
  border:1.5px solid var(--bdr);font-family:var(--font);font-size:14.5px;line-height:1.5;background:var(--bg);color:var(--txt);
}
#chat-input:focus{outline:none;border-color:var(--pri);background:var(--sur)}
.send-btn{
  width:40px;height:40px;flex-shrink:0;border-radius:50%;border:none;background:var(--bdr);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;
}
.send-btn.active{background:var(--pri)}
.send-btn svg{width:17px;height:17px}
#mic-msg{margin:0 12px 8px;padding:9px 12px;border-radius:8px;font-size:11.5px;line-height:1.6}

/* ── 설정 시트 ── */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;background:var(--sur);border-radius:16px 16px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;z-index:31;
  box-shadow:0 -4px 20px rgba(0,0,0,.15);max-height:80vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-hd h3{font-size:15.5px;font-weight:800}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--bg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub)}

/* ── 모델 선택(설정 시트) — 2026-07-03 신설, UI 전용 ── */
.model-section{margin-top:18px;padding-top:14px;border-top:1px solid var(--bdr)}
.model-section > label{font-size:12px;font-weight:700;color:var(--hint);display:block;margin-bottom:8px}
.model-mode-toggle{display:flex;gap:6px;margin-bottom:10px}
.mode-btn{flex:1;padding:9px 6px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--sur);color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer}
.mode-btn.active{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
#model-search{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--bdr);font-size:13px;font-family:var(--font);margin-bottom:8px}
#model-search:focus{outline:none;border-color:var(--pri)}
.model-list{max-height:220px;overflow-y:auto;border:1px solid var(--bdr);border-radius:8px;margin-bottom:8px}
.model-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bdr);cursor:pointer}
.model-item:last-child{border-bottom:none}
.model-item:active{background:var(--pri-bg)}
.model-item.selected{background:var(--pri-bg)}
.model-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.model-mode-toggle ~ #model-search ~ .model-list .model-check{border-radius:50%} /* single 모드일 때 라디오 느낌 */
.model-item.selected .model-check{background:var(--pri);border-color:var(--pri)}
.model-name{flex:1;min-width:0}
.model-name b{display:block;font-size:13px;font-weight:700;color:var(--txt)}
.model-name span{font-size:11px;color:var(--hint)}
.model-flag{font-size:11px;color:var(--hint);flex-shrink:0}
.model-empty{padding:16px;text-align:center;font-size:12.5px;color:var(--hint)}
.model-note{font-size:10.5px;color:var(--hint);line-height:1.6}
.ensemble-count{font-size:11px;color:var(--pri);font-weight:700;margin-bottom:8px;display:none}
.ensemble-count.show{display:block}
</style>
</head>
<body>

<header id="top-bar">
  <div class="tb-brand">
    <div class="tb-icon">⚖</div>
    <div>K-Law <span class="tb-sub" id="klaw-ver-badge">로딩 중…</span></div>
  </div>
  <button class="tb-gear" onclick="openSettings()" title="AI 모델 설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>
</header>

<main id="chat-thread"></main>

<div class="file-chips" id="file-chips"></div>
<footer id="input-bar">
  <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="파일 첨부">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
  </button>
  <input type="file" id="file-input" multiple accept=".txt,.pdf,.docx,.jpg,.jpeg,.png" style="display:none" onchange="handleAttach(this)">
  <button class="attach-btn" onclick="document.getElementById('cam-input').click()" title="사진 촬영">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none" onchange="handleAttach(this)">
  <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="음성 입력">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><line x1="12" y1="22" x2="12" y2="18"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
  </button>
  <textarea id="chat-input" rows="1" placeholder="메시지를 입력하세요…"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()" title="전송">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</footer>

<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSettings()"></div>
<div class="sheet" id="settings-sheet">
  <div class="sheet-hd">
    <h3>AI 모델 설정</h3>
    <button class="sheet-close" onclick="closeSettings()">✕</button>
  </div>

  <div class="model-section" style="margin-top:0;padding-top:0;border-top:none">
    <label>AI 모델 선택</label>
    <div class="model-mode-toggle">
      <button type="button" class="mode-btn active" id="mode-single" onclick="setModelMode('single')">단일 모델</button>
      <button type="button" class="mode-btn" id="mode-ensemble" onclick="setModelMode('ensemble')">앙상블 (여러 모델 토론)</button>
    </div>
    <input type="text" id="model-search" placeholder="모델·회사 이름으로 검색 (예: Claude, Gemini, Qwen, HyperCLOVA)…" oninput="renderModelList()">
    <div id="model-list" class="model-list"></div>
    <div class="model-note">
      ※ 지금은 UI 프로토타입입니다 — 선택은 이 기기에 저장되지만, 실제 판결 생성은
      여전히 K-Law 공유 계정(DeepSeek)이 처리합니다. 벤더별 실제 연동·앙상블 토론
      로직은 별도 백엔드 작업이 필요합니다.
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// GWP 파라미터 파싱 (gopang → 새 탭 호출 시 전달)
// ══════════════════════════════════════════════════════════════
const _qs        = new URLSearchParams(location.search);
const GWP_MODE    = _qs.get('gwp') === '1';
const GWP_TOKEN   = _qs.get('token')  || '';
const GWP_ORIGIN  = _qs.get('origin') || '';
let   GWP_CTX     = '';
if (_qs.get('ctx')) {
  try {

// klawMethodText(원문) 안의 "### B-1: ..." 섹션에서 대괄호 제목이
// bucketNames와 일치하는 블록만 뽑아 반환한다. 못 찾으면 빈 문자열.
function extractB1Buckets(fullText, bucketNames) {
  if (!fullText || !bucketNames?.length) return '';
  const b1Start = fullText.indexOf('### B-1:');
  const b2Start = fullText.indexOf('### B-2:');
  if (b1Start === -1) return '';
  const b1Section = fullText.slice(b1Start, b2Start === -1 ? undefined : b2Start);
  const blocks = b1Section.split(/\n---\n/);
  const matched = blocks.filter(block =>
    bucketNames.some(name => block.includes('**[' + name))
  );
  return matched.join('\n\n').trim();
}

async function loadKlawVersion() {
  try {
    const cached = JSON.parse(sessionStorage.getItem(_KLAW_CACHE_KEY) || 'null');
    if (cached?.version && cached?.text && cached?.format && cached?.ts && (Date.now() - cached.ts) < _KLAW_CACHE_TTL) {
      klawVersion = cached.version; klawMethodText = cached.text; klawFormatText = cached.format;
      document.getElementById('klaw-ver-badge').textContent = klawVersion;
      return;
    }
  } catch(e) {}
  // BUG-FIX(2026-07-03): GitHub fetch에 타임아웃이 없어서, 네트워크가 느리거나
  // API가 응답을 안 주면 상단바 "로딩 중…"이 무기한 멈춰있을 수 있었다 —
  // 8초 안에 안 끝나면 AbortController로 강제 중단하고 폴백 버전으로 진행한다.
  try {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 8000);
    const res = await fetch(KLAW_REPO_API, {cache:'no-cache', signal: ac.signal});
    const files = await res.json();
    clearTimeout(timer);
    const vFiles = (Array.isArray(files)?files:[]).map(f=>f.name).filter(n=>/^klaw_v[\d_]+\.md$/i.test(n));
    function parseVer(name){ const m=name.match(/klaw_v([\d]+)_?([\d]*)\.md/i); return m?parseFloat(m[1]+'.'+(m[2]||'0')):0; }
    vFiles.sort((a,b)=>parseVer(b)-parseVer(a));
    const latestFile = vFiles[0] || 'klaw_v15_0.md';
    const verMatch = latestFile.match(/klaw_v([\d]+_?[\d]*)\.md/i);
    klawVersion = verMatch ? 'v'+verMatch[1].replace('_','.') : 'v15.1';
    const ac2 = new AbortController();
    const timer2 = setTimeout(() => ac2.abort(), 8000);
    const [rawMethod, rawFormat] = await Promise.all([
      fetch(KLAW_RAW_BASE+latestFile, {cache:'no-cache', signal: ac2.signal}),
      fetch(KLAW_RAW_BASE+encodeURIComponent(KLAW_FORMAT_FILE), {cache:'no-cache', signal: ac2.signal}),
    ]);
    klawMethodText = await rawMethod.text();
    klawFormatText = rawFormat.ok ? await rawFormat.text() : '';
    if (!rawFormat.ok) console.warn('[K-Law] 출력형식 v13.3 로드 실패:', rawFormat.status);
    clearTimeout(timer2);
    try { sessionStorage.setItem(_KLAW_CACHE_KEY, JSON.stringify({version:klawVersion,text:klawMethodText,format:klawFormatText,ts:Date.now()})); } catch(e) {}
  } catch(e) {
    console.warn('[K-Law] GitHub 로드 실패(타임아웃 포함):', e.message);
    klawVersion = 'v15.1'; klawMethodText = ''; klawFormatText = '';
  }
  document.getElementById('klaw-ver-badge').textContent = klawVersion;
}
loadKlawVersion();

function _parseInterviewState(raw) {
  const m = raw.match(/<<<STATE>>>([\s\S]*?)<<<END>>>/);
  let state = null;
  if (m) { try { state = JSON.parse(m[1]); } catch(e) { state = null; } }
  const visible = raw.replace(/<<<STATE>>>[\s\S]*?<<<END>>>/, '').trim();
  return { visible, state };
}

function calcMatchRate(complexity) {
  const c = Math.max(1, Math.min(10, parseFloat(complexity) || 5));
  const rate = 99.99 - (c - 1) * (9.99 / 9);
  if (rate >= 99.9) return rate.toFixed(2) + '%';
  if (rate >= 99)   return rate.toFixed(1) + '%';
  return rate.toFixed(0) + '%';
}

// ══════════════════════════════════════════════════════════════
// LLM 호출 — 공유 계정 릴레이(BYOK 없음)
// ══════════════════════════════════════════════════════════════
async function _pumpSSE(response, handleJson) {
  if (!response.ok) {
    let errMsg = `HTTP ${response.status}`;
    try { const errBody = await response.json(); errMsg = errBody.message || errBody.error?.message || errBody.error || errMsg; } catch(e) {}
    throw new Error(errMsg);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') continue;
      let json;
      try { json = JSON.parse(payload); } catch(e) { continue; }
      handleJson(json);
    }
  }
}

// ── 공유 계정 릴레이 호출 (BYOK 없음 — 클라이언트는 API Key를 절대 갖지 않는다) ──
function _klawGuid() { return klawUser?.ipv6 || GWP_TOKEN || 'anonymous'; }


// 로그인 관련 오류(재로그인하면 해결되는 것)만 판정 — PROFILE_NOT_FOUND처럼
// 재로그인해도 못 고치는 오류는 여기 포함하지 않는다(재시도 무한루프 방지).
function _klawIsRecoverableAuthError(message) {
  return /로그인이 필요합니다|인증 토큰이 만료|토큰 서명이 유효하지 않습니다/.test(message || '');
}

async function _klawCall(tier, messages, opts = {}) {
  const { maxTokens = 1200, stream = false, onChunk = null, stepCycle = false, caseId = null, claimAmountKrw = null } = opts;

  const doRequest = async () => {
    const resp = await fetch(KLAW_RELAY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        guid: _klawGuid(), tier, messages, max_tokens: maxTokens, stream, step_cycle: stepCycle,
        currentLocation: GWP_FACTS?.currentLocation || null,
        phone_verify_token: KAuth.getToken(),
        // 2026-08-12 신설 — 사건단위 정액과금(§klaw_case_charges)에 필요한
        // 두 값. stepCycle이 아닐 때(STEP A/B/C)는 어차피 서버가 무시하지만,
        // 매 호출 형태를 통일해 분기 코드를 줄인다.
        case_id: caseId, claim_amount_krw: claimAmountKrw,
      })
    });

    if (stream) {
      let fullText = '';
      await _pumpSSE(resp, (json) => {
        const delta = json.choices?.[0]?.delta?.content || '';
        if (delta) { fullText += delta; onChunk && onChunk(delta, fullText); }
      });
      return fullText;
    }

    let data;
    try { data = await resp.json(); } catch(e) { throw new Error(`HTTP ${resp.status}`); }
    if (!resp.ok || data.error) throw new Error(data.message || data.error || `HTTP ${resp.status}`);
    return data.choices?.[0]?.message?.content || '';
  };

  try {
    return await doRequest();
  } catch (e) {
    // ★ 2026-09-02 사고실험으로 발견·보완 — 인터뷰가 길어지거나 STEP0~C
    // 판결 생성이 오래 걸리면 phone_verify_token(서버 TTL 10분)이 그
    // 도중에 만료될 수 있다. 이전엔 이 경우 해당 STEP에서 그대로
    // 중단되고, 이미 GDC가 청구된 이전 STEP 산출물까지 통째로 버린 채
    // 사용자가 사건 설명을 처음부터 다시 입력해야 했다(§runJudgementSim
    // catch 블록 참고 — 실패 시 phase를 interviewing으로 되돌림).
    // 재로그인으로 해결 가능한 오류로 보이면, 한 번만 재인증을 유도한
    // 뒤 같은 요청을 자동으로 다시 시도한다 — 응답이 아직 스트리밍
    // 시작 전(resp.ok가 아니면 _pumpSSE가 바로 던지므로 부분 출력이
    // 없다)이라 재시도해도 중복 텍스트가 섞이지 않는다.
    if (_klawIsRecoverableAuthError(e.message)) {
      KAuth.logout();
      await KAuth.ensureLogin();
      return await doRequest();
    }
    throw e;
  }
}

// 백엔드(/klaw/relay)는 아직 파일 업로드를 받지 않으므로, 텍스트류
// 파일은 읽어서 다음 사용자 메시지 앞에 자동으로 붙여 보내고, 이미지 등
// 그 외 파일은 칩으로 표시만 해 사용자가 상담 중 "이 서류를 첨부했다"는
// 사실을 대화로 언급할 수 있게 한다(실제 이미지 인식·OCR 연동은 범위 밖).
// ══════════════════════════════════════════════════════════════
let attachedFiles = [];
let attachedTextContext = '';

function handleAttach(inputEl) {
  const files = Array.from(inputEl.files || []);
  files.forEach(f => {
    attachedFiles.push(f);
    const chip = document.createElement('span');
    chip.className = 'file-chip';
    chip.innerHTML = `📎 ${escHtml(f.name)} <button type="button">✕</button>`;
    chip.querySelector('button').onclick = () => {
      attachedFiles = attachedFiles.filter(x => x !== f);
      chip.remove();
    };
    document.getElementById('file-chips').appendChild(chip);

    if (/\.(txt|md)$/i.test(f.name)) {
      const reader = new FileReader();
      reader.onload = () => { attachedTextContext += `\n\n[첨부파일 "${f.name}" 내용]\n${reader.result}`; };
      reader.readAsText(f);
    }
  });
  inputEl.value = '';
}

window._onGopangAuth = async function(user) {
  klawUser = user;
  console.info('[K-Law Auth] 고팡 인증 완료 — Lv.' + user.level + ' / ' + user.via);
  klawNickname = await _resolveNickname(user.ipv6 || GWP_TOKEN);
  startGreeting();
};

async function _resolveNickname(ipv6) {
  if (!ipv6) return '회원';
  try {
    const filter = encodeURIComponent(`guid='${ipv6}'`);
    const r = await fetch(`${L1_URL}?filter=${filter}&perPage=1`);
    const d = await r.json();
    return d.items?.[0]?.nickname || '회원';
  } catch(e) { console.warn('[K-Law] 닉네임 조회 실패:', e.message); return '회원'; }
};

function startGreeting() {
  if (conversationState.phase !== 'boot') return;
  const name = klawNickname || '회원';
  conversationState.phase = 'interviewing';
  conversationState.messages = [{ role:'system', content: INTERVIEW_SYSTEM_PROMPT }];

  // BUG-FIX(2026-07-03): GWP_CTX(나만의 AI 비서가 이 탭을 열며 넘긴, 사용자가
  // 방금 한 발화 원문)가 있는데도 지금까지는 무시하고 상투적 인사+재질문으로
  // 시작한 뒤, 사용자가 "다음에" 뭔가 입력해야만 _handleInterviewTurn()
  // 내부에서 슬쩍 끼워넣었다. 이제는 GWP_CTX가 있으면 그 발화를 곧바로 첫
  // 인터뷰 입력으로 사용한다 — 재질문 여부(사건 내용이었는지, 단순 "K-Law
  // 열어줘" 명령이었는지)는 여기서 미리 분류하지 않고, 그대로 INTERVIEW_
  // SYSTEM_PROMPT에게 판단을 맡긴다(내용이 있으면 바로 분석 질문, 없으면
  // 자연스럽게 "무엇을 도와드릴지" 물어보는 것도 인터뷰 LLM 몫).
  // BUG-FIX(2026-07-03, 2차): 1차 수정에서 "안녕하세요...확인하고 있습니다…"
  // 정적 말풍선을 먼저 띄운 뒤 사용자 발화 말풍선을 붙였는데, 두 가지 문제가
  // 있었다. (1) 순서가 거꾸로다 — AI가 먼저 "확인 중"이라 말하고 나서야
  // 사용자가 뭘 말했는지 보이면, 사용자 입장에선 무엇을 확인한다는 건지 먼저
  // 알 수 없다. (2) "확인하고 있습니다…"가 곧바로 이어지는 _handleInterviewTurn()
  // 내부의 타이핑 스피너("K-Law AI가 검토 중…")와 의미가 겹쳐 "확인 중"을
  // 두 번 말하는 것처럼 보인다. 이제 사용자 발화를 먼저 보여주고, AI 쪽은
  // 스피너 하나로만 "처리 중"을 표시한다 — K-Law라는 자기소개는 화면 상단
  // 헤더에 이미 표시되므로 별도 말풍선으로 반복하지 않는다.
  if (GWP_CTX && !_gwpSeedUsed) {
    _gwpSeedUsed = true;
    appendBubble('user', `<i>(AI 비서로부터 전달됨)</i><br>${escHtml(GWP_CTX).replace(/\n/g,'<br>')}`);
    _handleInterviewTurn(GWP_CTX);
    return;
  }

  appendBubble('ai', `
    안녕하세요. <b>${escHtml(name)}</b>님, 저는 K-Law 전문 AI입니다.<br>
    지금부터 대화를 통해 사건의 개요를 파악하고, 정확한 대법원 판결문 작성을 위해 필요한 데이터를 정리하겠습니다.<br>
    대화가 끝나면, 가상 판결문을 작성하여 새 탭에 저장합니다. 상당한 분량의 문서이므로 <b>PC에서 열어보실 것을 권합니다.</b><br><br>
    먼저, 사건 개요를 간략히 말씀해주세요. 마이크를 활성화하여 입력하는 것이 문자 입력보다 편하실 거예요.<br>
    자, 시작하시죠.
  `);
}

// 인증 콜백이 지연되거나(예: 이미 로그인된 세션) 오지 않는 예외 상황 대비 폴백
setTimeout(() => { if (conversationState.phase === 'boot') { klawNickname = '회원'; startGreeting(); } }, 4000);

async function sendMessage() {
  const ta = document.getElementById('chat-input');
  const text = ta.value.trim();
  if (!text) return;
  appendBubble('user', escHtml(text).replace(/\n/g,'<br>'));
  ta.value = ''; _micAutoResize(ta); _updateSendBtn();

  // 첨부된 텍스트 파일이 있으면 이번 발화에 자동으로 붙여 보낸다(UI 전용 —
  // 실제 사용된 텍스트만 소비하고 비운다)
  let sendText = text;
  if (attachedTextContext) { sendText = text + attachedTextContext; attachedTextContext = ''; }

  switch (conversationState.phase) {
    case 'interviewing': await _handleInterviewTurn(sendText); break;
    case 'generating':
      appendBubble('ai', '판결문을 작성하는 중입니다. 잠시만 기다려 주세요.');
      break;
    default: await _handleFreeQuestion(sendText); break;
  }
}

// ── 변호사 페르소나 인터뷰 — AI가 주도, 1턴 1질문, 6하원칙 슬롯을 상태로 누적 ──
async function _handleInterviewTurn(text) {
  // 2026-09-02 — 사건 입력(첫 인터뷰 발화)이 실제로 시작되기 직전에만
  // 로그인을 유도한다. 사용자 발화 말풍선은 호출부(sendMessage·
  // startGreeting의 GWP_CTX 분기)에서 이미 그려진 뒤이므로, 로그인
  // 오버레이가 그 위에 겹쳐 뜨고 인증을 마치면 그대로 이어서 진행된다.
  await KAuth.ensureLogin();

  let userContent = text;
  if (GWP_CTX && !_gwpSeedUsed) {
    userContent = `[사용자가 사전에 "나만의 AI 비서"와 나눈 맥락 — 참고만 하고 그대로 인용하지 말 것]\n${GWP_CTX}\n\n[사용자의 이번 발화]\n${text}`;
    _gwpSeedUsed = true;
  }
  conversationState.messages.push({ role:'user', content: userContent });
  conversationState.turnCount++;

  const typing = appendTyping();
  try {
    const raw = await _klawCall(KLAW_TIER_INTERVIEW, conversationState.messages, { maxTokens: 700 });
    typing.remove();
    const { visible, state } = _parseInterviewState(raw);
    conversationState.messages.push({ role:'assistant', content: raw });

    if (state) {
      conversationState.caseState = {
        level: state.level || conversationState.caseState.level,
        type:  state.type  || conversationState.caseState.type,
        who:   state.who   || conversationState.caseState.who,
        when:  state.when  || conversationState.caseState.when,
        where: state.where || conversationState.caseState.where,
        what:  state.what  || conversationState.caseState.what,
        how:   state.how   || conversationState.caseState.how,
        why:   state.why   || conversationState.caseState.why,
        extra: state.extra || conversationState.caseState.extra,
        claimAmount: (Number(state.claim_amount) > 0) ? Number(state.claim_amount) : conversationState.caseState.claimAmount,
      };
    }

    appendBubble('ai', escHtml(visible).replace(/\n/g,'<br>'));

    // 최소 2턴은 주고받은 뒤에야 종료를 인정 — 첫 발화만 보고 바로 "충분"이라
    // 판단하는 조급한 종료를 방지(실제 상담에서도 최소한의 확인 절차는 필요).
    if (state?.ready && conversationState.turnCount >= 2) {
      conversationState.phase = 'generating';
      setTimeout(runJudgementSim, 400);
    }
  } catch(e) {
    typing.remove();
    appendBubble('ai', `⚠ ${escHtml(e.message)}`);
  }
}

// 2026-08-13 신설 — 사고실험 F2 대응. worker.js GET /klaw/quota로 오늘
// 남은 판결 생성 횟수를 조회해 재생성 버튼에 반영한다. 조회 실패는
// 조용히 무시(버튼 기본 문구 그대로 유지) — 이 표시는 안내용일 뿐
// 실제 차단은 서버가 하므로, 표시 실패가 기능을 막으면 안 된다.
async function _updateKlawRegenQuotaLabel(btnId) {
  try {
    // ★ 2026-09-02 사고실험으로 발견·수정 — 예전엔 _klawGuid()(기기
    // 지문/고팡 guid)로 조회했는데, /klaw/relay가 전화번호 인증 guid로
    // 사용량을 기록하도록 바뀐 뒤로는 이 조회가 엉뚱한 guid를 보고 있어
    // "오늘 3/3 남음"처럼 항상 틀린 값을 보여주는 표시 버그가 있었다
    // (실제 차단은 서버가 하므로 안전 문제는 아니지만, 안내가 계속
    // 틀리면 신뢰를 잃는다). worker.js도 phone_verify_token을 받도록
    // 함께 고쳤다.
    const res = await fetch(PROXY + '/klaw/quota?phone_verify_token=' + encodeURIComponent(KAuth.getToken() || ''));
    const json = await res.json();
    if (!json.ok) return;
    const btn = document.getElementById(btnId);
    if (!btn) return;
    if (json.remaining <= 0) {
      btn.textContent = '오늘 판결 생성 한도를 모두 사용했습니다(내일 다시 가능)';
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
    } else {
      const feeNote = _klawBetaUsageBillingActive() ? '실사용량만큼 과금' : '추가 요금 없음';
      btn.textContent = `🔁 이 사건으로 다시 생성 (${feeNote} · 오늘 ${json.remaining}/${json.limit} 남음)`;
    }
  } catch (e) { /* 안내용 표시일 뿐이므로 실패해도 조용히 무시 */ }
}

// 2026-08-12 신설 — "이 사건으로 다시 생성" 버튼 핸들러. caseId를 건드리지
// 않고 그대로 runJudgementSim()을 재호출한다(§runJudgementSim 상단 주석
// 참고 — caseId가 이미 있으면 _ensureCaseId()가 새로 발급하지 않음).
window.regenerateSameCase = function() {
  if (conversationState.phase !== 'done') return; // 이미 생성 중이면 중복 클릭 무시
  conversationState.phase = 'generating';
  runJudgementSim();
};

// ══════════════════════════════════════════════════════════════
// STEP 0~C 판결 시뮬레이션 (desktop.html 파이프라인 재사용)
// ══════════════════════════════════════════════════════════════
async function runJudgementSim() {
  const caseNo = 'SIM-' + new Date().getFullYear() + '-' + String(++simCount).padStart(4,'0');
  const cs     = conversationState.caseState || {};
  const level  = cs.level || '3심';
  // 2026-08-12 신설 — caseNo(표시용, 매 실행마다 새로 발급되는 순번)와
  // caseId(과금용, 같은 사건이면 재생성해도 동일 유지)를 반드시 구분할 것.
  // 재생성 버튼(regenerateSameCase 등)에서 이 함수를 다시 호출해도
  // conversationState.caseId는 이미 설정돼 있으므로 _ensureCaseId()가
  // 새로 발급하지 않고 기존 값을 그대로 돌려준다 — 그래야 서버가 "같은
  // 사건"으로 인식해 두 번째부터는 요금을 면제한다.
  const caseId = _ensureCaseId();
  window._verdictParts  = {};
  window._verdictCaseNo = caseNo;

  const progress = appendBubble('ai', _progressHtml(0, STEP_DEFS.length, 'STEP 0 준비 중…'));
  const priorityBuckets = CASE_TYPE_TO_B1_BUCKET[cs.type] || [];
  const b1Excerpt = extractB1Buckets(klawMethodText, priorityBuckets);
  const baseCtx = `사건번호: ${caseNo}\n심급: ${level}\n사건분류: ${cs.type||''}\n` +
    `누가: ${cs.who||''}\n언제: ${cs.when||''}\n어디서: ${cs.where||''}\n무엇을: ${cs.what||''}\n어떻게: ${cs.how||''}\n왜: ${cs.why||''}\n` +
    `추가 사실: ${cs.extra||''}` +
    (b1Excerpt ? `\n\n[이 사건유형(${cs.type})에 우선 적용되는 부록 B-1 원칙 발췌]\n${b1Excerpt}` : '');

  for (let i = 0; i < STEP_DEFS.length; i++) {
    const stepDef = STEP_DEFS[i];
    progress.innerHTML = _progressHtml(i, STEP_DEFS.length, stepDef.tag + ' 작성 중…');
    const prevParts = Object.values(window._verdictParts).join('\n\n');
    const contextWithPrev = prevParts ? `[이전 STEP 출력]\n${prevParts}\n\n[사건 정보]\n${baseCtx}` : `[사건 정보]\n${baseCtx}`;
    const prompt = stepDef.prompt(contextWithPrev);
    const msgs = [{ role:'system', content: buildKlawSimPrompt() }, { role:'user', content: prompt }];
    try {
      const isStep0 = stepDef.id === 'step0';
      const result = await _klawCall(KLAW_TIER_VERDICT, msgs, {
        maxTokens: 3000, stream: true, stepCycle: isStep0,
        // 2026-08-12 수정(서버측 사고실험 발견1 대응) — case_id는 STEP0뿐
        // 아니라 A/B/C에도 매번 실어 보낸다. 서버(worker.js handleKlawRelay)가
        // "이 호출이 사건단위 정액 흐름에 속하는가"를 case_id 유무로
        // 판정하도록 바뀌었기 때문에, STEP A/B/C에서 이 값이 빠지면 다시
        // 예전처럼 토큰 종량제로 이중과금된다. claim_amount_krw는 여전히
        // STEP0(결제 시도 시점)에서만 의미가 있어 나머지 단계는 null.
        //
        // ★ 2026-08-13 수정(사고실험 발견 F1, 주피터 결정 — 소송가액 없는
        // 사건도 최소 tier 5,000원 고정 부과) — 이전엔 `cs.claimAmount || null`
        // 이었는데, cs.claimAmount는 항상 숫자(미입력 시 기본값 0)라 JS에서
        // 0이 falsy로 처리돼 null로 치환됐다. 서버는 null을 "유효금액 없음"
        // 으로 판단해 과금·사건기록 생성을 모두 건너뛰므로, 형사·소년보호처럼
        // 소송가액이 없는 사건이 의도와 달리 전부 무료 처리되고 있었다.
        // _klawFlatFeeForClaimAmount(0)은 이미 최소 tier(~1천만원, 5,000원)에
        // 정확히 매칭되므로, 여기서는 0을 null로 바꾸지 않고 그대로 보낸다.
        caseId: caseId,
        claimAmountKrw: isStep0 ? cs.claimAmount : null,
      });
      window._verdictParts[stepDef.id] = result;
    } catch(e) {
      progress.innerHTML = `⚠ ${stepDef.tag} 생성 중 오류: ${escHtml(e.message)}`;
      conversationState.phase = 'interviewing';
      return;
    }
  }
  progress.remove();

  const fullText = Object.values(window._verdictParts).join('\n\n');
  window._verdictText = fullText;
  appendBubble('ai', buildVerdictSummaryBubble(fullText, caseNo));
  openVerdictTab(fullText, caseNo);
  const _regenBtnId = 'klaw-regen-btn-' + Date.now();
  appendBubble('ai',
    `📄 가상 판결문을 새 탭(마크다운)에 저장했습니다. 상당한 분량이니 <b>PC에서 열람하시는 것을 권장</b>합니다.<br>` +
    `궁금한 문구나 표현이 있으면 여기서 바로 물어보세요.<br><br>` +
    // 2026-08-12 신설 — 결과가 마음에 안 들 때 "동일 사건"으로 다시 생성할
    // 수 있는 명시적 진입점. onclick으로 regenerateSameCase()를 호출하면
    // conversationState.caseId를 그대로 유지한 채 runJudgementSim()을 다시
    // 돌리므로, 서버(klaw_case_charges 매칭)가 같은 사건으로 인식해 두
    // 번째부터는 GDC를 다시 차감하지 않는다.
    // ★ 2026-08-13 — 사고실험 발견 F2 대응: GDC는 무료여도 일일 생성
    // 횟수(1일 3회) 한도는 재생성에도 그대로 소진된다. 버튼 문구가 그
    // 사실을 안 알려주면 사용자가 "추가 요금 없음"만 보고 몇 번이고
    // 눌러도 될 거라 오해할 수 있어, 남은 횟수를 조회해 표시한다.
    // ★ 2026-09-02 — 아래 초기 문구는 _updateKlawRegenQuotaLabel()의
    // 비동기 조회가 끝나기 전(또는 그 조회 자체가 실패했을 때) 잠깐
    // 그대로 남을 수 있으므로, 처음부터 베타 여부에 맞는 문구로 적어
    // "추가 요금 없음"이 실제로는 과금되는 베타 기간에 잘못 노출되는
    // 일이 없게 한다.
    `<button id="${_regenBtnId}" onclick="regenerateSameCase()" style="margin-top:4px;padding:8px 14px;border:none;border-radius:8px;background:#0057A8;color:#fff;font-weight:600;cursor:pointer">` +
    `🔁 이 사건으로 다시 생성 (${_klawBetaUsageBillingActive() ? '실사용량만큼 과금' : '추가 요금 없음'})</button>`
  );
  _updateKlawRegenQuotaLabel(_regenBtnId);
  conversationState.phase = 'done';
  _sendPdvReport({ summary: 'K-Law 모바일 대화 판결 시뮬레이션 완료: ' + caseNo, goal: '가상 판결문 생성' });

  // ── GWP_DONE 보고(2026-07-10 신설) ──────────────────────────────
  // gwp-registry.js에 klaw가 GWP 라우팅 대상으로 등록돼 있는데도 지금까지
  // AI 비서에게 결과를 보고하는 코드가 전혀 없었다(check_gwp_report_compliance.py
  // 미준수 목록). window.opener가 있을 때만(=GWP 경유) 의미가 있고, 판결
  // 시뮬레이션 완료가 이 세션의 목적 완수 시점이므로 여기서 1회 발신한다.
  if (window.opener) {
    import('https://hondi.net/src/gopang/gwp/gwp-report-client.js')
      .then(({ reportGwpSessionEnd, recordOwnerPDV }) => {
        // consultation(사용자와의 상담) — reportGwpSessionEnd() 내부에서
        // 2026-07-20부로 자동 기록됨(gwp-report-client.js (c) 참조).
        reportGwpSessionEnd({
          agencyId: 'klaw',
          guid: _klawGuid(),
          messages: conversationState.messages,
          resultText: fullText,
          summaryLine: 'K-Law 판결 시뮬레이션 완료: ' + caseNo,
          gwpMode: GWP_MODE,
          gwpOrigin: GWP_ORIGIN,
        }).catch(() => {});

        // own_output(K-Law 자신의 산출물) — 2026-07-20 신설. 실사용자의
        // 실제 사건이라 대응하는 실제 판결이 없으므로 평가 점수는 없다
        // (그건 benchmark.html의 별도 흐름 — 실제 판결문이 있는 과거
        // 사건을 K-Law에 입력해 생성과 채점을 같은 흐름에서 수행함).
        // 여기서는 판결문 본문에 이미 있는 K-Law 자신의 예측치(자기평가,
        // 검증 아님)만 detail에 같이 남긴다.
        const predictedMatch = (fullText.match(/\[K-Law 대법원 판결 일치도 예상:\s*([\d.]+%[^\]]*?)\]/) || [])[1] || null;
        recordOwnerPDV({
          ownerAgency: 'klaw',
          recordType: 'own_output',
          what: 'K-Law 가상 판결문 생성: ' + caseNo,
          how: 'completed',
          detail: {
            subtype: 'verdict_generated',
            case_no: caseNo,
            klaw_version: klawVersion,
            predicted_match_rate: predictedMatch, // 자기평가 예측치일 뿐, 검증된 값 아님
            verified: false,
          },
        }).catch(() => {});
      })
      .catch(() => {});
  }
}

function buildVerdictSummaryBubble(fullText, caseNo) {
  const confM    = fullText.match(/\[법리 확신도:\s*([\d.]+)\/10\]/);
  const factM    = fullText.match(/\[사실 확신도:\s*([\d.]+)\/10\]/);
  const totalM   = fullText.match(/\[종합 확신도:\s*([\d.]+)\/10\]/);
  const complexM = fullText.match(/\[사건 복잡도:\s*([\d.]+)\/10\]/);
  const matchLLM = fullText.match(/\[K-Law 대법원 판결 일치도 예상:\s*([\d.]+%[^\]]*?)\]/);
  const typeM    = fullText.match(/\[결론 유형:\s*([^\]]+)\]/);
  const summM    = fullText.match(/판결 요약:\s*([\s\S]{1,200}?)(?:\n\n|\[━|$)/);
  const totalConf = totalM ? totalM[1] : '—';
  const complexity = complexM ? complexM[1] : null;
  const vType = typeM ? typeM[1].trim() : '—';
  const summary = summM ? summM[1].trim() : '';
  const matchRate = matchLLM ? matchLLM[1].trim() : (complexity ? calcMatchRate(complexity) : '90~99.99%');
  return `
    <div class="verdict-card">
      <div class="vc-badge">사건번호 ${escHtml(caseNo)} · K-Law ${escHtml(klawVersion)}</div>
      ${summary ? `<div class="vc-summary">${escHtml(summary)}</div>` : ''}
      <div class="vc-grid">
        <div><span>종합 확신도</span><b>${escHtml(totalConf)}/10</b></div>
        <div><span>사건 복잡도</span><b>${complexity ? escHtml(complexity)+'/10' : '—'}</b></div>
        <div><span>대법원 일치도 예상</span><b>${escHtml(matchRate)}</b></div>
        <div><span>결론 유형</span><b>${escHtml(vType)}</b></div>
      </div>
    </div>`;
}

function openVerdictTab(mdText, caseNo) {
  const safe = mdText.replace(/<\/script>/g, '<\\/script>');
  // BUG-FIX(2026-07-03, 치명적): 아래 템플릿 리터럴 안에 있는 "script 태그
  // 예시 문자열"은 JS 문자열 안에 있을 뿐이지만, 브라우저의 HTML 파서는
  // JS를 전혀 이해하지 못한 채 원본 소스 텍스트에서 리터럴 "닫는 script
  // 태그" 문자열을 만나는 즉시 지금 이 script 요소가 끝났다고 판단해버린다
  // (HTML 파싱은 JS 파싱보다 먼저, 그리고 완전히 별개로 일어난다). 그 결과
  // 이 지점 이후 파일 전체(openSettings, 아이콘 숨김 로직 등 전부)가
  // "스크립트 밖의 평범한 HTML 텍스트"로 취급되어 단 한 줄도 JavaScript로
  // 실행되지 않고 있었다 — 설정 버튼 먹통, 로딩 무한정지, 아이콘 미숨김 등
  // 이번에 보고된 증상 전부가 이 한 줄에서 비롯됐다. marked.js CDN
  // <script> 태그의 닫는 태그를 "<\\/script>"로 이스케이프해 HTML 파서가 실제
  // 스크립트 종료로 오인하지 못하게 한다(마지막 줄의 <\\/script>는 원래도
  // 이스케이프돼 있었는데, 이 CDN 태그 쪽만 빠져 있었다).
  const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>K-Law 가상판결문 — ${caseNo}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

async function _handleFreeQuestion(text) {
  conversationState.messages.push({ role:'user', content: text });
  const typing = appendTyping();
  try {
    const sys = { role:'system', content: `당신은 K-Law 전문 AI입니다. 방금 작성한 아래 가상판결문 내용에 대한 사용자의 질문에 친절하고 정확하게 답하세요. 판결문에 없는 내용은 추측하지 말고 정보 부족을 명시하세요.\n\n[판결문]\n${window._verdictText || '(아직 작성되지 않음)'}` };
    const resp = await _klawCall(KLAW_TIER_INTERVIEW, [sys, { role:'user', content: text }], { maxTokens: 800 });
    typing.remove();
    appendBubble('ai', escHtml(resp).replace(/\n/g,'<br>'));
    conversationState.messages.push({ role:'assistant', content: resp });
  } catch(e) {
    typing.remove();
    appendBubble('ai', `⚠ 오류: ${escHtml(e.message)}`);
  }
}

async function _sendPdvReport(action) {
  try {
    const user_guid = klawUser?.ipv6 || GWP_TOKEN || 'anonymous';
    await fetch(`${PROXY}/pdv_log`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ user_guid, source:'klaw-mobile', report:{ pdv_6w:{
        who: user_guid, when: new Date().toISOString(), where: location.href,
        what: action.summary, how: 'subsystem-auth Lv.'+(klawUser?.level||1), why: action.goal
      }}})
    });
  } catch(e) { console.warn('[K-Law] PDV 전송 실패:', e.message); }
}

let modelMode = localStorage.getItem('klaw_model_mode') || 'single';
let selectedModels = (() => {
  try { return JSON.parse(localStorage.getItem('klaw_selected_models') || '[]'); } catch(e) { return []; }
})();

function setModelMode(mode) {
  modelMode = mode;
  localStorage.setItem('klaw_model_mode', mode);
  document.getElementById('mode-single').classList.toggle('active', mode === 'single');
  document.getElementById('mode-ensemble').classList.toggle('active', mode === 'ensemble');
  // 단일 모드로 되돌아가면 선택을 1개로 축소
  if (mode === 'single' && selectedModels.length > 1) {
    selectedModels = selectedModels.slice(0, 1);
    localStorage.setItem('klaw_selected_models', JSON.stringify(selectedModels));
  }
  renderModelList();
}

function toggleModel(key) {
  if (modelMode === 'single') {
    selectedModels = [key];
  } else {
    const i = selectedModels.indexOf(key);
    if (i === -1) selectedModels.push(key); else selectedModels.splice(i, 1);
  }
  localStorage.setItem('klaw_selected_models', JSON.stringify(selectedModels));
  renderModelList();
}

function renderModelList() {
  const q = (document.getElementById('model-search')?.value || '').trim().toLowerCase();
  const list = document.getElementById('model-list');
  if (!list) return;
  const filtered = MODEL_CATALOG.filter(m =>
    !q || m.name.toLowerCase().includes(q) || m.vendor.toLowerCase().includes(q)
  );
  if (filtered.length === 0) {
    list.innerHTML = '<div class="model-empty">검색 결과가 없어요.</div>';
    return;
  }
  list.innerHTML = filtered.map(m => {
    const key = m.vendor + ':' + m.name;
    const sel = selectedModels.includes(key);
    return `<div class="model-item ${sel?'selected':''}" onclick="toggleModel('${key.replace(/'/g,"\\'")}')">
      <span class="model-check">${sel ? '✓' : ''}</span>
      <span class="model-name"><b>${escHtml(m.name)}</b><span>${escHtml(m.vendor)}</span></span>
      <span class="model-flag">${m.country}</span>
    </div>`;
  }).join('');

  const cnt = document.querySelector('.ensemble-count');
  if (modelMode === 'ensemble') {
    if (!cnt) {
      const div = document.createElement('div');
      div.className = 'ensemble-count show';
      document.getElementById('model-search').insertAdjacentElement('afterend', div);
    }
    document.querySelector('.ensemble-count').textContent = `${selectedModels.length}개 모델 선택됨 — 서로 논쟁하여 결론을 도출합니다`;
    document.querySelector('.ensemble-count').classList.add('show');
  } else if (cnt) {
    cnt.classList.remove('show');
  }
}

// ══════════════════════════════════════════════════════════════
// 음성 입력 (Web Speech API — v3.6 패턴 재사용, 단일 입력창용)
// ══════════════════════════════════════════════════════════════
let isRecording = false;
let recognition = null;

function _detectMicEnv() {
  const inIframe   = window.self !== window.top;
  const isSecure   = window.isSecureContext;
  const isArtifact = location.hostname.includes('claude') || location.hostname.includes('artifact');
  return { inIframe, isSecure, isArtifact };
}
async function _checkMicPermission() {
  if (!navigator.permissions) return 'unknown';
  try { const r = await navigator.permissions.query({ name:'microphone' }); return r.state; } catch(e) { return 'unknown'; }
}
function _micShowMsg(html, type = 'warn') {
  document.getElementById('mic-msg')?.remove();
  const colors = { warn:{bg:'#FFF3CD',bd:'#FDE68A',tx:'#78350F'}, error:{bg:'#FEE2E2',bd:'#FCA5A5',tx:'#7F1D1D'}, info:{bg:'#EFF6FF',bd:'#BFDBFE',tx:'#1E3A5F'} }[type] || {};
  const div = document.createElement('div');
  div.id = 'mic-msg';
  div.style.cssText = `background:${colors.bg};border:1px solid ${colors.bd};color:${colors.tx};`;
  div.innerHTML = html;
  document.getElementById('input-bar').insertAdjacentElement('beforebegin', div);
  setTimeout(() => div.remove(), 12000);
}
function _micSetIdle(btn) {
  isRecording = false; btn.classList.remove('recording');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><line x1="12" y1="22" x2="12" y2="18"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
  recognition = null;
}
function _micSetActive(btn) {
  isRecording = true; btn.classList.add('recording');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
}
function _micAutoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }
function _updateSendBtn() {
  const ta = document.getElementById('chat-input');
  const hasText = ta.value.trim().length > 0;
  document.getElementById('send-btn').classList.toggle('active', hasText);
  // 입력을 시작하면 좌측 아이콘(파일첨부·카메라·마이크)을 숨겨 입력창에
  // 공간을 더 준다 — 단, 녹음 중인 마이크는 사용자가 중지할 수 있어야
  // 하므로 예외로 계속 노출한다.
  document.querySelectorAll('.attach-btn').forEach(b => b.style.display = hasText ? 'none' : '');
  const micBtn = document.getElementById('mic-btn');
  if (micBtn) micBtn.style.display = (hasText && !isRecording) ? 'none' : '';
}

async function toggleMic() {
  const btn = document.getElementById('mic-btn');
  const ta  = document.getElementById('chat-input');
  if (isRecording) { recognition && recognition.stop(); return; }

  const env = _detectMicEnv();
  if (env.isArtifact || env.inIframe) { _micShowMsg('<strong>🎙️ 미리보기 환경에서는 마이크를 사용할 수 없습니다.</strong><br>실제 배포 URL에서 사용하세요.', 'info'); return; }
  if (!env.isSecure) { _micShowMsg('<strong>🎙️ HTTPS가 아닌 환경에서는 마이크를 사용할 수 없습니다.</strong>', 'error'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { _micShowMsg('⚠️ 이 브라우저는 음성-텍스트 변환을 지원하지 않습니다.<br>Chrome 또는 Edge를 사용해 주세요.', 'warn'); return; }
  const perm = await _checkMicPermission();
  if (perm === 'denied') { _micShowMsg('<strong>🎙️ 마이크 권한이 차단되어 있습니다.</strong><br>주소창 왼쪽 🔒 → 사이트 설정 → 마이크 → 허용 후 새로고침하세요.', 'error'); return; }

  recognition = new SR();
  recognition.lang = 'ko-KR'; recognition.continuous = true; recognition.interimResults = true; recognition.maxAlternatives = 1;
  let finalText = ta.value; let interim = '';

  recognition.onstart = () => { _micSetActive(btn); document.getElementById('mic-msg')?.remove(); };
  recognition.onresult = (e) => {
    interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    ta.value = finalText + interim; _micAutoResize(ta);
  };
  recognition.onend = () => { _micSetIdle(btn); ta.value = finalText; _micAutoResize(ta); _updateSendBtn(); };
  recognition.onerror = (e) => {
    _micSetIdle(btn);
    const msgs = {
      'not-allowed': ['마이크 권한이 거부되었습니다.<br>주소창 🔒 → 사이트 설정 → 마이크 → 허용 후 새로고침하세요.', 'error'],
      'service-not-allowed': ['음성 인식 서비스가 허용되지 않았습니다.', 'error'],
      'network': ['네트워크 오류로 음성 인식에 실패했습니다.', 'warn'],
      'no-speech': ['음성이 감지되지 않았습니다. 마이크에 가까이 대고 다시 시도하세요.', 'warn'],
      'audio-capture': ['마이크를 찾을 수 없습니다.', 'error'],
    };
    if (e.error !== 'aborted' && msgs[e.error]) _micShowMsg('🎙️ ' + msgs[e.error][0], msgs[e.error][1]);
  };
  recognition.start();
}

document.addEventListener('DOMContentLoaded', () => {
