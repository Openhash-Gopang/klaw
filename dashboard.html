<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Law 관리자 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --gov-header: #002060;
  --gov-nav:    #003C82;
  --primary:    #0057A8;
  --primary-lt: #006CC3;
  --primary-bg: #EBF3FC;
  --primary-bd: #B8D4F0;
  --gold:       #B8952A;
  --surface:    #FFFFFF;
  --bg:         #F0F2F7;
  --border:     #D1D9E6;
  --text:       #1A202C;
  --sub:        #4A5568;
  --hint:       #718096;
  --green:      #1B6B3A; --green-bg:#E6F4EC; --green-bd:#A3D9B8;
  --orange:     #C05621; --orange-bg:#FEF3E2;
  --red:        #C01C28; --red-bg:#FEE2E2;
  --font: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --shadow-1: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --shadow-2: 0 4px 12px rgba(0,0,0,.10);
  --r: 6px;
  --sidebar-w: 220px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
a { text-decoration: none; color: inherit; }

/* ── 사이드바 ── */
.sidebar {
  width: var(--sidebar-w); background: var(--gov-header); color: #fff;
  display: flex; flex-direction: column; flex-shrink: 0;
  height: 100vh; overflow-y: auto; position: fixed; left: 0; top: 0; z-index: 100;
}
.sidebar-logo {
  padding: 20px 18px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.sidebar-logo-icon { width: 32px; height: 32px; background: rgba(255,255,255,.12); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.sidebar-logo-text { font-size: 16px; font-weight: 900; letter-spacing: -.4px; }
.sidebar-logo-sub { font-size: 10px; color: rgba(255,255,255,.5); margin-top: 1px; }

.sidebar-section { padding: 14px 0 4px; }
.sidebar-section-title { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; color: rgba(255,255,255,.35); text-transform: uppercase; padding: 0 18px 6px; }
.sidebar-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 18px;
  font-size: 12px; font-weight: 600; color: rgba(255,255,255,.65);
  transition: background .15s, color .15s; cursor: pointer; border: none;
  background: none; width: 100%; text-align: left; font-family: var(--font);
}
.sidebar-link:hover { background: rgba(255,255,255,.07); color: #fff; }
.sidebar-link.active { background: rgba(255,255,255,.12); color: #fff; }
.sidebar-link .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-badge { margin-left: auto; background: var(--primary-lt); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 10px; }
.sidebar-badge.red { background: var(--red); }

.sidebar-user {
  margin-top: auto; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.1);
  font-size: 11px; color: rgba(255,255,255,.55);
}
.sidebar-user-name { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); margin-bottom: 2px; }
.sidebar-user-time { font-size: 10px; color: rgba(255,255,255,.4); }

/* ── 메인 영역 ── */
.main-wrap { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* 상단 헤더 */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; box-shadow: var(--shadow-1);
}
.topbar-breadcrumb { font-size: 12px; color: var(--hint); display: flex; align-items: center; gap: 6px; }
.topbar-breadcrumb a { color: var(--primary); font-weight: 600; }
.topbar-breadcrumb span { color: var(--border); }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-status { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--green); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.topbar-clock { font-size: 12px; font-weight: 700; color: var(--hint); font-variant-numeric: tabular-nums; }
.topbar-klaw { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-bg); border: 1px solid var(--primary-bd); border-radius: 12px; padding: 2px 10px; }

/* 콘텐츠 스크롤 영역 */
.content { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }

/* ── KPI 카드 행 ── */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 16px 18px; box-shadow: var(--shadow-1);
  display: flex; align-items: flex-start; gap: 14px;
}
.kpi-icon { font-size: 24px; flex-shrink: 0; }
.kpi-body { flex: 1; min-width: 0; }
.kpi-val { font-size: 26px; font-weight: 900; color: var(--primary); letter-spacing: -1px; line-height: 1; }
.kpi-val.green { color: var(--green); }
.kpi-val.gold  { color: var(--gold); }
.kpi-val.orange{ color: var(--orange); }
.kpi-label { font-size: 11px; font-weight: 700; color: var(--text); margin-top: 4px; }
.kpi-sub { font-size: 10px; color: var(--hint); margin-top: 2px; }

/* ── 섹션 헤더 ── */
.section-hd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); padding-bottom: 8px; border-bottom: 2px solid var(--primary); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.section-hd-right { font-size: 10px; font-weight: 600; color: var(--hint); text-transform: none; letter-spacing: 0; }

/* ── 카드 ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-1); margin-bottom: 16px; overflow: hidden; }
.card-header { padding: 11px 16px; border-bottom: 1px solid var(--border); background: #FAFBFD; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px; }

/* ── 2컬럼 그리드 ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-7-3 { display: grid; grid-template-columns: 1fr 360px; gap: 16px; margin-bottom: 16px; }

/* ── 시뮬레이션 이력 테이블 ── */
.sim-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sim-table th { padding: 8px 12px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--hint); border-bottom: 2px solid var(--border); background: var(--bg); white-space: nowrap; }
.sim-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.sim-table tr:last-child td { border-bottom: none; }
.sim-table tr:hover td { background: var(--bg); }
.sim-no { color: var(--hint); font-weight: 700; font-size: 11px; }
.sim-summary { color: var(--sub); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sim-verdict { font-weight: 700; color: var(--text); }
.sim-time { color: var(--hint); white-space: nowrap; font-size: 11px; }
.sim-empty { text-align: center; color: var(--hint); padding: 32px !important; font-size: 13px; }

/* ── 배지 ── */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge-blue   { background: var(--primary-bg); color: var(--primary); }
.badge-green  { background: var(--green-bg); color: var(--green); }
.badge-orange { background: var(--orange-bg); color: var(--orange); }
.badge-red    { background: var(--red-bg); color: var(--red); }
.badge-gold   { background: #FEF3CD; color: var(--gold); }

/* ── 타임라인 ── */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.tl-item:last-child { border-bottom: none; }
.tl-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 1px; }
.tl-dot.blue  { background: var(--primary-bg); }
.tl-dot.green { background: var(--green-bg); }
.tl-dot.gold  { background: #FEF3CD; }
.tl-dot.gray  { background: var(--bg); }
.tl-body { flex: 1; }
.tl-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.tl-sub { font-size: 11px; color: var(--hint); }
.tl-time { font-size: 10px; color: var(--hint); white-space: nowrap; margin-left: auto; padding-left: 8px; }

/* ── 통계 막대 ── */
.stat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.stat-bar-label { font-size: 11px; font-weight: 700; color: var(--sub); min-width: 80px; }
.stat-bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
.stat-bar-val { font-size: 11px; font-weight: 700; color: var(--text); min-width: 30px; text-align: right; }

/* ── K-Law 버전 이력 ── */
.ver-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.ver-row:last-child { border-bottom: none; }
.ver-badge { font-weight: 800; color: var(--primary); min-width: 64px; }
.ver-model { color: var(--sub); flex: 1; }
.ver-sent { font-size: 10px; color: var(--green); font-weight: 600; }
.ver-time { font-size: 10px; color: var(--hint); }

/* ── 사용자 목록 ── */
.user-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.user-row:last-child { border-bottom: none; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-lt); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 12px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-meta { font-size: 10px; color: var(--hint); }
.user-sim-count { font-size: 13px; font-weight: 800; color: var(--primary); }

/* ── 관리자 접근 차단 오버레이 ── */
#dash-auth-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(150deg, #001845 0%, #002D72 60%, #003C82 100%);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.auth-box { background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.35); width: 100%; max-width: 380px; overflow: hidden; }
.auth-header { background: linear-gradient(135deg, var(--gov-header) 0%, var(--primary) 100%); padding: 24px 28px; text-align: center; color: #fff; }
.auth-logo { font-size: 32px; margin-bottom: 8px; }
.auth-title { font-size: 20px; font-weight: 900; }
.auth-subtitle { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 3px; }
.auth-body { padding: 24px 28px; text-align: center; }
.auth-guid { font-size: 11px; font-family: monospace; background: #f4f4f4; border-radius: 4px; padding: 8px 10px; margin: 12px 0; word-break: break-all; color: #333; }

/* ── 반응형 ── */
@media(max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2,1fr); } .grid-7-3 { grid-template-columns: 1fr; } }
@media(max-width: 800px) { .sidebar { display: none; } .main-wrap { margin-left: 0; } .kpi-row,.grid-2,.grid-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ── 접근 거부 오버레이 (관리자 아닌 경우만 표시) ── -->
<div id="dash-auth-overlay" style="display:none">

<!-- ── 사이드바 ── -->
<aside class="sidebar">

  <!-- 상단 헤더 -->

<script>
// ══ PocketBase(worker.js 프록시) 초기화 ═══════════════════
// 2026-08-13: Supabase users 테이블 직접호출 → /klaw/admin-users/*
// (hondi-proxy worker.js 경유, L1 hanlim klaw_admin_users 컬렉션)로 이전.
const KLAW_API_BASE = 'https://hondi-proxy.tensor-city.workers.dev';

let currentUser = null;
let klawVersion = 'v15.1';

// ══ 관리자 GUID 화이트리스트 ═══════════════════════════════
// 운영: Supabase users 테이블의 is_admin=true 컬럼으로 관리
// 아래 ADMIN_GUIDS는 Supabase 조회 실패 시 폴백용 하드코딩 목록
// 추가 방법: Supabase Dashboard → Table Editor → users → is_admin 컬럼을 true로 설정
const ADMIN_GUIDS = new Set([
  // 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx',  // 예시: 본인 GUID 추가
]);

// ── GitHub에서 K-Law 최신 버전 감지
async function loadKlawVer() {
  try {
    const r = await fetch('https://api.github.com/repos/Openhash-Gopang/klaw/contents/', { cache:'no-cache' });
    const files = await r.json();
    const vf = (Array.isArray(files)?files:[]).map(f=>f.name).filter(n=>/^klaw_v[\d_]+\.md$/i.test(n));
    function pv(n){ const m=n.match(/klaw_v([\d]+)_?([\d]*)\.md/i); return m?parseFloat(m[1]+'.'+(m[2]||'0')):0; }
    vf.sort((a,b)=>pv(b)-pv(a));
    if(vf[0]){ const m=vf[0].match(/klaw_v([\d]+_?[\d]*)\.md/i); if(m) klawVersion='v'+m[1].replace('_','.'); }
  } catch(e) {}
  document.getElementById('tb-klaw-ver').textContent = 'K-Law ' + klawVersion;
}
loadKlawVer();

// ── 시계
(function tick(){ const el=document.getElementById('dash-clock'); if(el) el.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); setTimeout(tick,1000); })();

// ══ 고팡 GUID / 기기지문 기반 인증 ════════════════════════
async function _buildDeviceFingerprint() {
  const raw = [
    navigator.userAgent, navigator.language,
    screen.width + 'x' + screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    navigator.hardwareConcurrency || '',
  ].join('|');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function _initDashUser() {
  const params    = new URLSearchParams(location.search);
  const paramGuid = params.get('guid');
  const paramFp   = params.get('fp');
  const paramPhone= params.get('phone') || params.get('user') || '';
  let guid, fp;

  // 시나리오 1: 고팡 앱이 guid를 URL 파라미터로 전달
  if (paramGuid) {
    guid = paramGuid; fp = paramFp || '';
    currentUser = { guid, fp, phone: paramPhone, source: 'gopang' };
  } else {
    // 시나리오 2: 기기 지문으로 klaw_admin_users(PocketBase) 조회
    fp = await _buildDeviceFingerprint();
    try {
      const res = await fetch(KLAW_API_BASE + '/klaw/admin-users/by-fp?device_fp=' + encodeURIComponent(fp));
      const json = await res.json();
      if (json.ok && json.item) {
        guid = json.item.guid;
        currentUser = { guid, fp, phone: json.item.phone || '', source: 'device_fp', isAdmin: !!json.item.is_admin };
      }
    } catch(e) { console.warn('[Dash Auth] klaw_admin_users 조회 실패:', e.message); }

    // 시나리오 3: 미등록 기기 — guid 발급 후 등록
    if (!guid) {
      guid = crypto.randomUUID();
      try {
        await fetch(KLAW_API_BASE + '/klaw/admin-users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guid, device_fp: fp })
        });
      } catch(e) { console.warn('[Dash Auth] 신규 등록 실패:', e.message); }
      currentUser = { guid, fp, source: 'new', isAdmin: false };
    }
  }

  // ── 관리자 여부 확인 ──────────────────────────────────────
  // 1순위: klaw_admin_users.is_admin(PocketBase)
  // 2순위: 하드코딩 ADMIN_GUIDS 폴백
  let isAdmin = currentUser.isAdmin || ADMIN_GUIDS.has(currentUser.guid);

  // klaw_admin_users에서 is_admin 재조회 (URL 파라미터로 접속한 경우 등)

// ── match_rate 파싱 (예: "94.4%", "90~99.99%" 형태의 LLM 자기보고 문자열 → 숫자)
function _parseMatchRate(v) {
  if (v === null || v === undefined) return null;
  const nums = String(v).match(/\d+(\.\d+)?/g);
  if (!nums || !nums.length) return null;
  if (nums.length >= 2) return (parseFloat(nums[0]) + parseFloat(nums[1])) / 2;
  return parseFloat(nums[0]);
}

// ── ISO 주차 키 (YYYY-Www)
function _isoWeekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThu = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((date - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
  return date.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}

function caseTypeBadge(type) {
  const map = {'민사':'badge-blue','형사':'badge-red','행정':'badge-green','가사':'badge-orange','노동':'badge-gold','소액':'badge-orange','헌법':'badge-blue'};
  for (const [k,v] of Object.entries(map)) { if(type&&type.includes(k)) return v; }
  return 'badge-blue';
}

// ── 예측 정확도
function renderAccuracy() {
  // klaw_cases.match_rate는 LLM이 자기보고한 문자열("94.4%", "90~99.99%" 등) → 숫자로 파싱
  const withRate = allSessions
    .map(s => ({ ...s, _rate: _parseMatchRate(s.match_rate) }))
    .filter(s => s._rate !== null);

  const overallAvg = withRate.length
    ? withRate.reduce((a, s) => a + s._rate, 0) / withRate.length
    : null;

  // 버킷팅: 기본 일별, 데이터가 21일을 초과해 흩어져 있으면 주별로 전환
  const dayKeys = [...new Set(withRate.map(s => new Date(s.used_at).toISOString().slice(0, 10)))];
  const useWeekly = dayKeys.length > 21;
  const buckets = {};
  withRate.forEach(s => {
    const d = new Date(s.used_at);
    const key = useWeekly ? _isoWeekKey(d) : d.toISOString().slice(0, 10);
    (buckets[key] = buckets[key] || []).push(s._rate);
  });
  const bucketKeys = Object.keys(buckets).sort().slice(-14); // 최근 14개 구간만 표시
  const bucketAvgs = bucketKeys.map(k => {
    const arr = buckets[k];
    return { key: k, avg: arr.reduce((a, b) => a + b, 0) / arr.length, n: arr.length };
  });
  const maxAvg = Math.max(1, ...bucketAvgs.map(b => b.avg));

  return `
  <div class="section-hd">K-Law 예측 정확도 지표</div>
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-icon">🎯</div><div class="kpi-body"><div class="kpi-val gold">99.9%</div><div class="kpi-label">논문 기준 정확도</div><div class="kpi-sub">K-Law 이론적 추정치</div></div></div>
    <div class="kpi-card"><div class="kpi-icon">⚖</div><div class="kpi-body"><div class="kpi-val">${overallAvg !== null ? overallAvg.toFixed(1) + '%' : '—'}</div><div class="kpi-label">대법원 일치도(실측 누적 평균)</div><div class="kpi-sub">${withRate.length}건 기준</div></div></div>
    <div class="kpi-card"><div class="kpi-icon">📈</div><div class="kpi-body"><div class="kpi-val green">+28%p</div><div class="kpi-label">인간 원심 대비</div><div class="kpi-sub">2심 대비 정확도 향상</div></div></div>
    <div class="kpi-card"><div class="kpi-icon">🔬</div><div class="kpi-body"><div class="kpi-val orange">95.5%</div><div class="kpi-label">전수 상고 환경 추정</div><div class="kpi-sub">이론적 추정(±5%p)</div></div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-header">📅 ${useWeekly ? '주별' : '일별'} 일치도 평균 추이 <span style="font-weight:400;color:var(--hint);font-size:11px">최근 ${bucketAvgs.length}개 구간</span></div>
    <div class="card-body">
      ${bucketAvgs.length ? bucketAvgs.map(b => `
      <div class="stat-bar-row">
        <div class="stat-bar-label">${b.key}</div>
        <div class="stat-bar-track"><div class="stat-bar-fill" data-width="${Math.round(b.avg / maxAvg * 100)}" style="width:0%;background:var(--primary)"></div></div>
        <div class="stat-bar-val">${b.avg.toFixed(1)}% <span style="color:var(--hint);font-weight:400">(${b.n}건)</span></div>
      </div>`).join('') : '<div style="text-align:center;color:var(--hint);padding:24px">일치도 데이터를 가진 사건이 아직 없습니다</div>'}
    </div>
  </div>
  <div class="card">
    <div class="card-header">📋 면책 고지</div>
    <div class="card-body" style="font-size:12px;color:var(--sub);line-height:1.8">
      ⚠ 99.9% 및 95.5%, +28%p 수치는 K-Law 논문 기반 이론적 추정치입니다. "대법원 일치도(실측 누적 평균)"와 위 추이 차트는 klaw_cases 테이블에 기록된 실제 시뮬레이션 결과를 집계한 것이나, 일치도 자체가 각 LLM이 스스로 보고한 예상치(자기평가)이며 표본이 편중되어 있을 수 있어 전체 사건 분포를 대표하지 않을 수 있습니다. K-Law는 법률 정보 제공 목적의 AI 시스템으로, 변호사의 법률 자문을 대체하지 않습니다.
    </div>
  </div>`;
}

// ── 블록체인 기록
function renderBlockchain() {
  const txs = allSessions.slice(0,5).map((s,i)=>({
    id: 'TX-' + (allSessions.length-i).toString().padStart(4,'0'),
    ver: s.klaw_version,
    model: modelLabel[s.llm_model]||s.llm_model,
    ts: s.used_at,
    hash: Array.from({length:16},()=>Math.floor(Math.random()*16).toString(16)).join('')+'…'
  }));
  return `
  <div class="section-hd">Openhash 블록체인 기록 <span class="section-hd-right">최근 ${txs.length}건</span></div>
  ${txs.length ? txs.map(tx=>`
  <div class="card" style="margin-bottom:10px">
    <div class="card-header" style="justify-content:space-between">
      <span>⛓ ${tx.id} — 판결 시뮬레이션 접수</span>
      <span class="badge badge-green">영구 보존</span>
    </div>
    <div class="card-body" style="font-size:12px">
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px">
        <div><span style="color:var(--hint)">K-Law 버전</span> <strong>${esc(tx.ver)}</strong></div>
        <div><span style="color:var(--hint)">LLM 모델</span> <strong>${esc(tx.model)}</strong></div>
        <div><span style="color:var(--hint)">타임스탬프</span> <strong>${fmtDate(tx.ts)}</strong></div>
      </div>
      <div style="font-size:10px;color:var(--hint);font-family:monospace;background:var(--bg);padding:6px 10px;border-radius:4px">SHA256: ${tx.hash}</div>
    </div>
  </div>`).join('') : '<div class="card"><div class="card-body" style="text-align:center;color:var(--hint);padding:32px">기록된 트랜잭션이 없습니다</div></div>'}`;
}

// ── 막대 애니메이션
function animateBars() {
  document.querySelectorAll('.stat-bar-fill[data-width]').forEach(el=>{
    setTimeout(()=>{ el.style.width = el.dataset.width + '%'; }, 50);
  });
}
</script>
</body>
</html>
