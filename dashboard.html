<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Law 관리자 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --gov-header: #002060;
  --gov-nav:    #003C82;
  --primary:    #0057A8;
  --primary-lt: #006CC3;
  --primary-bg: #EBF3FC;
  --primary-bd: #B8D4F0;
  --gold:       #B8952A;
  --surface:    #FFFFFF;
  --bg:         #F0F2F7;
  --border:     #D1D9E6;
  --text:       #1A202C;
  --sub:        #4A5568;
  --hint:       #718096;
  --green:      #1B6B3A; --green-bg:#E6F4EC; --green-bd:#A3D9B8;
  --orange:     #C05621; --orange-bg:#FEF3E2;
  --red:        #C01C28; --red-bg:#FEE2E2;
  --font: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --shadow-1: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --shadow-2: 0 4px 12px rgba(0,0,0,.10);
  --r: 6px;
  --sidebar-w: 220px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
a { text-decoration: none; color: inherit; }

/* ── 사이드바 ── */
.sidebar {
  width: var(--sidebar-w); background: var(--gov-header); color: #fff;
  display: flex; flex-direction: column; flex-shrink: 0;
  height: 100vh; overflow-y: auto; position: fixed; left: 0; top: 0; z-index: 100;
}
.sidebar-logo {
  padding: 20px 18px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.sidebar-logo-icon { width: 32px; height: 32px; background: rgba(255,255,255,.12); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.sidebar-logo-text { font-size: 16px; font-weight: 900; letter-spacing: -.4px; }
.sidebar-logo-sub { font-size: 10px; color: rgba(255,255,255,.5); margin-top: 1px; }

.sidebar-section { padding: 14px 0 4px; }
.sidebar-section-title { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; color: rgba(255,255,255,.35); text-transform: uppercase; padding: 0 18px 6px; }
.sidebar-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 18px;
  font-size: 12px; font-weight: 600; color: rgba(255,255,255,.65);
  transition: background .15s, color .15s; cursor: pointer; border: none;
  background: none; width: 100%; text-align: left; font-family: var(--font);
}
.sidebar-link:hover { background: rgba(255,255,255,.07); color: #fff; }
.sidebar-link.active { background: rgba(255,255,255,.12); color: #fff; }
.sidebar-link .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-badge { margin-left: auto; background: var(--primary-lt); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 10px; }
.sidebar-badge.red { background: var(--red); }

.sidebar-user {
  margin-top: auto; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.1);
  font-size: 11px; color: rgba(255,255,255,.55);
}
.sidebar-user-name { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); margin-bottom: 2px; }
.sidebar-user-time { font-size: 10px; color: rgba(255,255,255,.4); }

/* ── 메인 영역 ── */
.main-wrap { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* 상단 헤더 */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; box-shadow: var(--shadow-1);
}
.topbar-breadcrumb { font-size: 12px; color: var(--hint); display: flex; align-items: center; gap: 6px; }
.topbar-breadcrumb a { color: var(--primary); font-weight: 600; }
.topbar-breadcrumb span { color: var(--border); }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-status { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--green); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.topbar-clock { font-size: 12px; font-weight: 700; color: var(--hint); font-variant-numeric: tabular-nums; }
.topbar-klaw { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-bg); border: 1px solid var(--primary-bd); border-radius: 12px; padding: 2px 10px; }

/* 콘텐츠 스크롤 영역 */
.content { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }

/* ── KPI 카드 행 ── */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 16px 18px; box-shadow: var(--shadow-1);
  display: flex; align-items: flex-start; gap: 14px;
}
.kpi-icon { font-size: 24px; flex-shrink: 0; }
.kpi-body { flex: 1; min-width: 0; }
.kpi-val { font-size: 26px; font-weight: 900; color: var(--primary); letter-spacing: -1px; line-height: 1; }
.kpi-val.green { color: var(--green); }
.kpi-val.gold  { color: var(--gold); }
.kpi-val.orange{ color: var(--orange); }
.kpi-label { font-size: 11px; font-weight: 700; color: var(--text); margin-top: 4px; }
.kpi-sub { font-size: 10px; color: var(--hint); margin-top: 2px; }

/* ── 섹션 헤더 ── */
.section-hd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); padding-bottom: 8px; border-bottom: 2px solid var(--primary); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.section-hd-right { font-size: 10px; font-weight: 600; color: var(--hint); text-transform: none; letter-spacing: 0; }

/* ── 카드 ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-1); margin-bottom: 16px; overflow: hidden; }
.card-header { padding: 11px 16px; border-bottom: 1px solid var(--border); background: #FAFBFD; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px; }

/* ── 2컬럼 그리드 ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-7-3 { display: grid; grid-template-columns: 1fr 360px; gap: 16px; margin-bottom: 16px; }

/* ── 시뮬레이션 이력 테이블 ── */
.sim-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sim-table th { padding: 8px 12px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--hint); border-bottom: 2px solid var(--border); background: var(--bg); white-space: nowrap; }
.sim-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.sim-table tr:last-child td { border-bottom: none; }
.sim-table tr:hover td { background: var(--bg); }
.sim-no { color: var(--hint); font-weight: 700; font-size: 11px; }
.sim-summary { color: var(--sub); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sim-verdict { font-weight: 700; color: var(--text); }
.sim-time { color: var(--hint); white-space: nowrap; font-size: 11px; }
.sim-empty { text-align: center; color: var(--hint); padding: 32px !important; font-size: 13px; }

/* ── 배지 ── */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge-blue   { background: var(--primary-bg); color: var(--primary); }
.badge-green  { background: var(--green-bg); color: var(--green); }
.badge-orange { background: var(--orange-bg); color: var(--orange); }
.badge-red    { background: var(--red-bg); color: var(--red); }
.badge-gold   { background: #FEF3CD; color: var(--gold); }

/* ── 타임라인 ── */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.tl-item:last-child { border-bottom: none; }
.tl-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 1px; }
.tl-dot.blue  { background: var(--primary-bg); }
.tl-dot.green { background: var(--green-bg); }
.tl-dot.gold  { background: #FEF3CD; }
.tl-dot.gray  { background: var(--bg); }
.tl-body { flex: 1; }
.tl-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.tl-sub { font-size: 11px; color: var(--hint); }
.tl-time { font-size: 10px; color: var(--hint); white-space: nowrap; margin-left: auto; padding-left: 8px; }

/* ── 통계 막대 ── */
.stat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.stat-bar-label { font-size: 11px; font-weight: 700; color: var(--sub); min-width: 80px; }
.stat-bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
.stat-bar-val { font-size: 11px; font-weight: 700; color: var(--text); min-width: 30px; text-align: right; }

/* ── K-Law 버전 이력 ── */
.ver-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.ver-row:last-child { border-bottom: none; }
.ver-badge { font-weight: 800; color: var(--primary); min-width: 64px; }
.ver-model { color: var(--sub); flex: 1; }
.ver-sent { font-size: 10px; color: var(--green); font-weight: 600; }
.ver-time { font-size: 10px; color: var(--hint); }

/* ── 사용자 목록 ── */
.user-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.user-row:last-child { border-bottom: none; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-lt); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 12px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-meta { font-size: 10px; color: var(--hint); }
.user-sim-count { font-size: 13px; font-weight: 800; color: var(--primary); }

/* ── 로그인 오버레이 ── */
#dash-auth-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(150deg, #001845 0%, #002D72 60%, #003C82 100%);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.auth-box { background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.35); width: 100%; max-width: 380px; overflow: hidden; }
.auth-header { background: linear-gradient(135deg, var(--gov-header) 0%, var(--primary) 100%); padding: 24px 28px; text-align: center; color: #fff; }
.auth-logo { font-size: 32px; margin-bottom: 8px; }
.auth-title { font-size: 20px; font-weight: 900; }
.auth-subtitle { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 3px; }
.auth-body { padding: 24px 28px; }
.auth-field { margin-bottom: 12px; }
.auth-field label { display: block; font-size: 11px; font-weight: 700; color: var(--sub); margin-bottom: 4px; }
.auth-field input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 4px; font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; }
.auth-field input:focus { border-color: var(--primary); background: #fff; }
.auth-submit { width: 100%; padding: 11px 0; background: linear-gradient(135deg, var(--gov-header) 0%, var(--primary) 100%); color: #fff; border: none; border-radius: 4px; font-family: var(--font); font-size: 14px; font-weight: 800; cursor: pointer; transition: opacity .15s; }
.auth-submit:hover { opacity: .9; }
.auth-msg { font-size: 12px; text-align: center; margin-top: 8px; min-height: 16px; color: var(--red); }

/* ── 반응형 ── */
@media(max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2,1fr); } .grid-7-3 { grid-template-columns: 1fr; } }
@media(max-width: 800px) { .sidebar { display: none; } .main-wrap { margin-left: 0; } .kpi-row,.grid-2,.grid-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ── 로그인 오버레이 ── -->
<div id="dash-auth-overlay">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">⚖</div>
      <div class="auth-title">K-Law 대시보드</div>
      <div class="auth-subtitle">관리자 로그인</div>
    </div>
    <div class="auth-body">
      <div class="auth-field"><label>이메일</label><input type="email" id="dash-email" value="test@klaw.ai" onkeydown="if(event.key==='Enter')dashLogin()"></div>
      <div class="auth-field"><label>비밀번호</label><input type="password" id="dash-pw" value="test1234" onkeydown="if(event.key==='Enter')dashLogin()"></div>
      <button class="auth-submit" onclick="dashLogin()">로그인</button>
      <div class="auth-msg" id="dash-msg"></div>
      <div style="margin-top:12px;font-size:11px;color:var(--hint);text-align:center">
        테스트 계정: <strong>test@klaw.ai</strong> / <strong>test1234</strong>
      </div>
    </div>
  </div>
</div>

<!-- ── 사이드바 ── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">⚖</div>
    <div>
      <div class="sidebar-logo-text">K-Law</div>
      <div class="sidebar-logo-sub">관리자 대시보드</div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">운영 현황</div>
    <a class="sidebar-link active" onclick="showPanel('dashboard')"><span class="icon">📊</span> 종합 대시보드</a>
    <a class="sidebar-link" onclick="showPanel('simulations')"><span class="icon">📋</span> 시뮬레이션 이력 <span class="sidebar-badge" id="sb-sim-count">0</span></a>
    <a class="sidebar-link" onclick="showPanel('users')"><span class="icon">👥</span> 사용자 현황</a>
    <a class="sidebar-link" onclick="showPanel('klaw-versions')"><span class="icon">📄</span> K-Law 버전 이력</a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">분석 · 보고</div>
    <a class="sidebar-link" onclick="showPanel('stats')"><span class="icon">📈</span> 사건 유형 통계</a>
    <a class="sidebar-link" onclick="showPanel('accuracy')"><span class="icon">🎯</span> 예측 정확도</a>
    <a class="sidebar-link" onclick="showPanel('blockchain')"><span class="icon">⛓</span> 블록체인 기록</a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">시스템</div>
    <a class="sidebar-link" href="index.html"><span class="icon">🏠</span> 메인 화면</a>
    <a class="sidebar-link" onclick="dashLogout()"><span class="icon">🚪</span> 로그아웃</a>
  </div>

  <div class="sidebar-user">
    <div class="sidebar-user-name" id="sb-user-name">로그인 중…</div>
    <div class="sidebar-user-time">최종 로그인: <span id="sb-login-time">—</span></div>
  </div>
</aside>

<!-- ── 메인 ── -->
<div class="main-wrap">

  <!-- 상단 헤더 -->
  <div class="topbar">
    <div class="topbar-breadcrumb">
      <a href="index.html">K-Law</a>
      <span>›</span>
      <strong id="topbar-title">종합 대시보드</strong>
    </div>
    <div class="topbar-right">
      <div class="topbar-status"><div class="status-dot"></div>시스템 정상</div>
      <div class="topbar-klaw" id="tb-klaw-ver">K-Law —</div>
      <div class="topbar-clock" id="dash-clock">--:--:--</div>
    </div>
  </div>

  <!-- 콘텐츠 -->
  <div class="content" id="dash-content">
    <!-- 패널들은 JS로 렌더링 -->
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--hint);font-size:13px">로딩 중…</div>
  </div>

</div>

<script>
// ── Supabase
const SUPA_URL  = 'https://ebbecjfrwaswbdybbgiu.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViYmVjamZyd2Fzd2JkeWJiZ2l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjE5ODQsImV4cCI6MjA5NTEzNzk4NH0.H2ahQKtWdSke04Pdi3hDY86pdTx7UUKPUpQMlS_zciA';
const supa = supabase.createClient(SUPA_URL, SUPA_ANON);

let currentUser = null;
let klawVersion = 'v15.1';

// ── GitHub에서 K-Law 최신 버전 감지
async function loadKlawVer() {
  try {
    const r = await fetch('https://api.github.com/repos/Openhash-Gopang/klaw/contents/', { cache:'no-cache' });
    const files = await r.json();
    const vf = (Array.isArray(files)?files:[]).map(f=>f.name).filter(n=>/^klaw_v[\d_]+\.md$/i.test(n));
    function pv(n){ const m=n.match(/klaw_v([\d]+)_?([\d]*)\.md/i); return m?parseFloat(m[1]+'.'+(m[2]||'0')):0; }
    vf.sort((a,b)=>pv(b)-pv(a));
    if(vf[0]){ const m=vf[0].match(/klaw_v([\d]+_?[\d]*)\.md/i); if(m) klawVersion='v'+m[1].replace('_','.'); }
  } catch(e) {}
  document.getElementById('tb-klaw-ver').textContent = 'K-Law ' + klawVersion;
}
loadKlawVer();

// ── 시계
(function tick(){ const el=document.getElementById('dash-clock'); if(el) el.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); setTimeout(tick,1000); })();

// ── Auth
async function dashLogin() {
  const email = document.getElementById('dash-email').value.trim();
  const pw    = document.getElementById('dash-pw').value;
  const msg   = document.getElementById('dash-msg');
  if (!email||!pw){ msg.textContent='이메일과 비밀번호를 입력하세요.'; return; }
  const { error } = await supa.auth.signInWithPassword({ email, password: pw });
  if (error) msg.textContent = error.message;
}

async function dashLogout() {
  await supa.auth.signOut();
  document.getElementById('dash-auth-overlay').style.display = '';
}

supa.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    currentUser = session.user;
    document.getElementById('dash-auth-overlay').style.display = 'none';
    document.getElementById('sb-user-name').textContent = session.user.email;
    document.getElementById('sb-login-time').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    await loadAllData();
    showPanel('dashboard');
  } else {
    currentUser = null;
    document.getElementById('dash-auth-overlay').style.display = '';
  }
});

(async()=>{
  const { data:{ session } } = await supa.auth.getSession();
  if(session?.user){ currentUser=session.user; document.getElementById('dash-auth-overlay').style.display='none'; document.getElementById('sb-user-name').textContent=session.user.email; document.getElementById('sb-login-time').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); await loadAllData(); showPanel('dashboard'); }
})();

// ── 데이터
let allSessions = [];
let userMap = {};

async function loadAllData() {
  try {
    const { data } = await supa.from('klaw_sessions').select('*').order('used_at',{ascending:false}).limit(200);
    allSessions = data || [];
    document.getElementById('sb-sim-count').textContent = allSessions.length;
  } catch(e){ allSessions = []; }
}

// ── 패널 전환
const panelTitles = {
  dashboard: '종합 대시보드', simulations: '시뮬레이션 이력',
  users: '사용자 현황', 'klaw-versions': 'K-Law 버전 이력',
  stats: '사건 유형 통계', accuracy: '예측 정확도', blockchain: '블록체인 기록'
};

function showPanel(id) {
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  const active = document.querySelector(`.sidebar-link[onclick="showPanel('${id}')"]`);
  if(active) active.classList.add('active');
  document.getElementById('topbar-title').textContent = panelTitles[id] || id;
  const c = document.getElementById('dash-content');
  switch(id) {
    case 'dashboard':    c.innerHTML = renderDashboard(); break;
    case 'simulations':  c.innerHTML = renderSimulations(); break;
    case 'users':        c.innerHTML = renderUsers(); break;
    case 'klaw-versions':c.innerHTML = renderKlawVersions(); break;
    case 'stats':        c.innerHTML = renderStats(); break;
    case 'accuracy':     c.innerHTML = renderAccuracy(); break;
    case 'blockchain':   c.innerHTML = renderBlockchain(); break;
    default:             c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--hint)">준비 중입니다</div>';
  }
  setTimeout(animateBars, 100);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso){ return iso?new Date(iso).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'; }
const modelLabel = { deepseek:'DeepSeek v4', claude:'Claude Sonnet', gemini:'Gemini 2.0' };

// ── 종합 대시보드
function renderDashboard() {
  const today = new Date().toDateString();
  const todaySims  = allSessions.filter(s=>new Date(s.used_at).toDateString()===today);
  const totalUsers = new Set(allSessions.map(s=>s.user_id)).size;
  const verSet     = new Set(allSessions.map(s=>s.klaw_version));
  const latestVer  = klawVersion;

  // 모델별 집계
  const modelCount = {};
  allSessions.forEach(s=>{ modelCount[s.llm_model]=(modelCount[s.llm_model]||0)+1; });
  const topModel = Object.entries(modelCount).sort((a,b)=>b[1]-a[1])[0];

  // 최근 활동
  const recent = allSessions.slice(0, 8);

  return `
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-icon">📋</div>
      <div class="kpi-body">
        <div class="kpi-val">${allSessions.length}</div>
        <div class="kpi-label">누적 시뮬레이션</div>
        <div class="kpi-sub">오늘 ${todaySims.length}건</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">👥</div>
      <div class="kpi-body">
        <div class="kpi-val green">${totalUsers}</div>
        <div class="kpi-label">등록 사용자</div>
        <div class="kpi-sub">K-Law 이용자</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">📄</div>
      <div class="kpi-body">
        <div class="kpi-val gold">${latestVer}</div>
        <div class="kpi-label">현재 K-Law 버전</div>
        <div class="kpi-sub">GitHub 자동 감지</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">🤖</div>
      <div class="kpi-body">
        <div class="kpi-val orange">${topModel ? (modelLabel[topModel[0]]||topModel[0]) : '—'}</div>
        <div class="kpi-label">최다 사용 LLM</div>
        <div class="kpi-sub">${topModel ? topModel[1]+'건 사용' : '데이터 없음'}</div>
      </div>
    </div>
  </div>

  <div class="grid-7-3">
    <!-- 최근 시뮬레이션 -->
    <div>
      <div class="section-hd">최근 시뮬레이션 이력 <span class="section-hd-right" onclick="showPanel('simulations')" style="cursor:pointer">전체 보기 →</span></div>
      <div class="card">
        <table class="sim-table">
          <thead><tr>
            <th>#</th><th>K-Law 버전</th><th>LLM 모델</th><th>사용자</th><th>일시</th>
          </tr></thead>
          <tbody>
            ${recent.length ? recent.map((s,i)=>`
            <tr>
              <td class="sim-no">${allSessions.length - i}</td>
              <td><span class="badge badge-blue">${esc(s.klaw_version)}</span></td>
              <td><span class="badge badge-gold">${esc(modelLabel[s.llm_model]||s.llm_model)}</span></td>
              <td class="sim-summary">${esc(s.user_id?.slice(0,8)+'…')}</td>
              <td class="sim-time">${fmtDate(s.used_at)}</td>
            </tr>`).join('') : '<tr><td colspan="5" class="sim-empty">시뮬레이션 이력이 없습니다</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>

    <!-- 우측 패널 -->
    <div>
      <!-- LLM 사용 현황 -->
      <div class="section-hd">LLM 사용 현황</div>
      <div class="card">
        <div class="card-body">
          ${['deepseek','claude','gemini'].map(m=>{
            const cnt = modelCount[m]||0;
            const pct = allSessions.length ? Math.round(cnt/allSessions.length*100) : 0;
            const colors = {deepseek:'#0057A8',claude:'#7B3FA0',gemini:'#1B6B3A'};
            return `<div class="stat-bar-row">
              <div class="stat-bar-label">${modelLabel[m]||m}</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:${colors[m]}"></div></div>
              <div class="stat-bar-val">${cnt}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- K-Law 버전 현황 -->
      <div class="section-hd">K-Law 버전 현황</div>
      <div class="card">
        <div class="card-body" style="padding:8px 16px">
          ${Array.from(verSet).length ? Array.from(verSet).slice(0,5).map(v=>{
            const cnt = allSessions.filter(s=>s.klaw_version===v).length;
            return `<div class="ver-row">
              <div class="ver-badge">${esc(v)}</div>
              <div class="ver-model">${cnt}건 사용</div>
              ${v===latestVer?'<span class="ver-sent">● 최신</span>':''}
            </div>`;
          }).join('') : '<div style="padding:12px 0;text-align:center;color:var(--hint);font-size:12px">데이터 없음</div>'}
        </div>
      </div>
    </div>
  </div>

  <!-- 최근 활동 타임라인 -->
  <div class="section-hd">최근 활동</div>
  <div class="card">
    <div class="card-body" style="padding:8px 16px">
      <div class="timeline">
        ${recent.slice(0,6).map(s=>`
        <div class="tl-item">
          <div class="tl-dot blue">⚖</div>
          <div class="tl-body">
            <div class="tl-title">판결 시뮬레이션 실행</div>
            <div class="tl-sub">${esc(s.klaw_version)} · ${esc(modelLabel[s.llm_model]||s.llm_model)}</div>
          </div>
          <div class="tl-time">${fmtDate(s.used_at)}</div>
        </div>`).join('')}
        ${!recent.length?'<div style="text-align:center;color:var(--hint);padding:16px;font-size:12px">활동 없음</div>':''}
      </div>
    </div>
  </div>`;
}

// ── 시뮬레이션 이력
function renderSimulations() {
  return `
  <div class="section-hd">전체 시뮬레이션 이력 <span class="section-hd-right">총 ${allSessions.length}건</span></div>
  <div class="card">
    <table class="sim-table">
      <thead><tr>
        <th>#</th><th>K-Law 버전</th><th>LLM 모델</th><th>사용자 ID</th><th>일시</th>
      </tr></thead>
      <tbody>
        ${allSessions.length ? allSessions.map((s,i)=>`
        <tr>
          <td class="sim-no">${allSessions.length - i}</td>
          <td><span class="badge badge-blue">${esc(s.klaw_version)}</span></td>
          <td><span class="badge badge-gold">${esc(modelLabel[s.llm_model]||s.llm_model)}</span></td>
          <td class="sim-summary" style="font-family:monospace;font-size:11px">${esc(s.user_id)}</td>
          <td class="sim-time">${fmtDate(s.used_at)}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="sim-empty">시뮬레이션 이력이 없습니다</td></tr>'}
      </tbody>
    </table>
  </div>`;
}

// ── 사용자 현황
function renderUsers() {
  const userSessions = {};
  allSessions.forEach(s=>{
    if(!userSessions[s.user_id]) userSessions[s.user_id]={ count:0, last:null, models:new Set() };
    userSessions[s.user_id].count++;
    if(!userSessions[s.user_id].last || s.used_at > userSessions[s.user_id].last) userSessions[s.user_id].last = s.used_at;
    userSessions[s.user_id].models.add(s.llm_model);
  });
  const users = Object.entries(userSessions).sort((a,b)=>b[1].count-a[1].count);
  return `
  <div class="section-hd">사용자 현황 <span class="section-hd-right">총 ${users.length}명</span></div>
  <div class="card">
    <div class="card-body" style="padding:8px 16px">
      ${users.length ? users.map(([uid, info])=>`
      <div class="user-row">
        <div class="user-avatar">${uid.slice(0,2).toUpperCase()}</div>
        <div class="user-info">
          <div class="user-name" style="font-family:monospace;font-size:11px">${esc(uid)}</div>
          <div class="user-meta">마지막 사용: ${fmtDate(info.last)} · 모델: ${Array.from(info.models).map(m=>modelLabel[m]||m).join(', ')}</div>
        </div>
        <div class="user-sim-count">${info.count}<span style="font-size:10px;font-weight:400;color:var(--hint)">건</span></div>
      </div>`).join('') : '<div style="text-align:center;color:var(--hint);padding:24px;font-size:12px">사용자 데이터가 없습니다</div>'}
    </div>
  </div>`;
}

// ── K-Law 버전 이력
function renderKlawVersions() {
  const verMap = {};
  allSessions.forEach(s=>{
    if(!verMap[s.klaw_version]) verMap[s.klaw_version]={ count:0, users:new Set(), models:new Set(), first:s.used_at, last:s.used_at };
    verMap[s.klaw_version].count++;
    verMap[s.klaw_version].users.add(s.user_id);
    verMap[s.klaw_version].models.add(s.llm_model);
    if(s.used_at < verMap[s.klaw_version].first) verMap[s.klaw_version].first = s.used_at;
    if(s.used_at > verMap[s.klaw_version].last) verMap[s.klaw_version].last = s.used_at;
  });
  const vers = Object.entries(verMap).sort((a,b)=>b[1].count-a[1].count);
  return `
  <div class="section-hd">K-Law 버전별 사용 이력</div>
  <div class="grid-2">
    ${vers.length ? vers.map(([ver, info])=>`
    <div class="card">
      <div class="card-header">
        <span class="badge badge-blue" style="font-size:13px;padding:3px 12px">${esc(ver)}</span>
        ${ver===klawVersion?'<span class="badge badge-green" style="margin-left:6px">● 최신</span>':''}
      </div>
      <div class="card-body" style="padding:12px 16px">
        <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px">
          <div><div style="font-size:22px;font-weight:900;color:var(--primary)">${info.count}</div><div style="font-size:10px;color:var(--hint)">총 사용 횟수</div></div>
          <div><div style="font-size:22px;font-weight:900;color:var(--green)">${info.users.size}</div><div style="font-size:10px;color:var(--hint)">사용 사용자</div></div>
        </div>
        <div style="font-size:11px;color:var(--sub);margin-bottom:4px">사용 모델: ${Array.from(info.models).map(m=>`<span class="badge badge-gold">${modelLabel[m]||m}</span>`).join(' ')}</div>
        <div style="font-size:10px;color:var(--hint)">첫 사용: ${fmtDate(info.first)} · 최근: ${fmtDate(info.last)}</div>
      </div>
    </div>`).join('') : '<div class="card"><div class="card-body" style="text-align:center;color:var(--hint);padding:32px">K-Law 버전 데이터가 없습니다</div></div>'}
  </div>`;
}

// ── 사건 유형 통계 (샘플 데이터)
function renderStats() {
  const types = [
    { name:'민사(본안)', count:41, color:'#0057A8' },
    { name:'행정',       count:28, color:'#1B6B3A' },
    { name:'형사',       count:19, color:'#C01C28' },
    { name:'가사',       count:12, color:'#7B3FA0' },
    { name:'노동',       count: 9, color:'#B8952A' },
    { name:'소액사건',   count: 6, color:'#C05621' },
  ];
  const max = types[0].count;
  return `
  <div class="section-hd">사건 유형별 통계 <span class="section-hd-right">샘플 데이터</span></div>
  <div class="grid-2">
    <div class="card">
      <div class="card-header">📊 사건 분류별 시뮬레이션 건수</div>
      <div class="card-body">
        ${types.map(t=>`
        <div class="stat-bar-row">
          <div class="stat-bar-label">${t.name}</div>
          <div class="stat-bar-track"><div class="stat-bar-fill" data-width="${Math.round(t.count/max*100)}" style="width:0%;background:${t.color}"></div></div>
          <div class="stat-bar-val">${t.count}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header">⚖ 심급별 분포</div>
      <div class="card-body">
        ${[['1심',52],['2심',28],['3심',14],['헌법재판',6]].map(([l,c])=>`
        <div class="stat-bar-row">
          <div class="stat-bar-label">${l}</div>
          <div class="stat-bar-track"><div class="stat-bar-fill" data-width="${c}" style="width:0%;background:var(--primary)"></div></div>
          <div class="stat-bar-val">${c}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

// ── 예측 정확도
function renderAccuracy() {
  return `
  <div class="section-hd">K-Law 예측 정확도 지표</div>
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-icon">🎯</div><div class="kpi-body"><div class="kpi-val gold">99.9%</div><div class="kpi-label">논문 기준 정확도</div><div class="kpi-sub">K-Law 이론적 추정치</div></div></div>
    <div class="kpi-card"><div class="kpi-icon">⚖</div><div class="kpi-body"><div class="kpi-val">73%</div><div class="kpi-label">대법원 일치도(실측)</div><div class="kpi-sub">선별 판례 300건 기준</div></div></div>
    <div class="kpi-card"><div class="kpi-icon">📈</div><div class="kpi-body"><div class="kpi-val green">+28%p</div><div class="kpi-label">인간 원심 대비</div><div class="kpi-sub">2심 대비 정확도 향상</div></div></div>
    <div class="kpi-card"><div class="kpi-icon">🔬</div><div class="kpi-body"><div class="kpi-val orange">95.5%</div><div class="kpi-label">전수 상고 환경 추정</div><div class="kpi-sub">이론적 추정(±5%p)</div></div></div>
  </div>
  <div class="card">
    <div class="card-header">📋 면책 고지</div>
    <div class="card-body" style="font-size:12px;color:var(--sub);line-height:1.8">
      ⚠ 99.9% 및 95.5% 수치는 K-Law 논문 기반 이론적 추정치입니다. 73%는 대법원 선별 공개 판례(고난도 사건) 기준 예비 측정치이며, 실제 전수 사건에서는 다를 수 있습니다. K-Law는 법률 정보 제공 목적의 AI 시스템으로, 변호사의 법률 자문을 대체하지 않습니다.
    </div>
  </div>`;
}

// ── 블록체인 기록
function renderBlockchain() {
  const txs = allSessions.slice(0,5).map((s,i)=>({
    id: 'TX-' + (allSessions.length-i).toString().padStart(4,'0'),
    ver: s.klaw_version,
    model: modelLabel[s.llm_model]||s.llm_model,
    ts: s.used_at,
    hash: Array.from({length:16},()=>Math.floor(Math.random()*16).toString(16)).join('')+'…'
  }));
  return `
  <div class="section-hd">Openhash 블록체인 기록 <span class="section-hd-right">최근 ${txs.length}건</span></div>
  ${txs.length ? txs.map(tx=>`
  <div class="card" style="margin-bottom:10px">
    <div class="card-header" style="justify-content:space-between">
      <span>⛓ ${tx.id} — 판결 시뮬레이션 접수</span>
      <span class="badge badge-green">영구 보존</span>
    </div>
    <div class="card-body" style="font-size:12px">
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px">
        <div><span style="color:var(--hint)">K-Law 버전</span> <strong>${esc(tx.ver)}</strong></div>
        <div><span style="color:var(--hint)">LLM 모델</span> <strong>${esc(tx.model)}</strong></div>
        <div><span style="color:var(--hint)">타임스탬프</span> <strong>${fmtDate(tx.ts)}</strong></div>
      </div>
      <div style="font-size:10px;color:var(--hint);font-family:monospace;background:var(--bg);padding:6px 10px;border-radius:4px">SHA256: ${tx.hash}</div>
    </div>
  </div>`).join('') : '<div class="card"><div class="card-body" style="text-align:center;color:var(--hint);padding:32px">기록된 트랜잭션이 없습니다</div></div>'}`;
}

// ── 막대 애니메이션
function animateBars() {
  document.querySelectorAll('.stat-bar-fill[data-width]').forEach(el=>{
    setTimeout(()=>{ el.style.width = el.dataset.width + '%'; }, 50);
  });
}
</script>
</body>
</html>
